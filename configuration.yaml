# Managed via git: edit in ~/Projects/ha-config on mash-ubie, deploy with `ha-config deploy`

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.30.32.0/23
    - 192.168.4.0/22
    - 172.30.232.0/23
amcrest:
  - host: 192.168.4.196
    name: Office Camera
    username: admin
    password: !secret amcrest_password
    port: 80
    stream_source: rtsp
    binary_sensors:
      - motion_detected
      - online
homeassistant:
  external_url: https://ha.mattmariani.com
  internal_url: http://192.168.6.38:8123
#  auth_providers:
#    - type: trusted_networks
#      trusted_networks:
#        - 192.168.5.187/32   # Living Room Display
#        - 192.168.4.105/32   # Kitchen Hub
#      trusted_users:
#        192.168.5.187: 037e6c277ce1476b9b15bebab084cfd1
#        192.168.4.105: 037e6c277ce1476b9b15bebab084cfd1
#      allow_bypass_login: true
#    - type: homeassistant    # Keep normal login for other devices

input_boolean:
  pocket_sign_battery_test:
    name: Battery warning test mode
    icon: mdi:battery-alert-variant-outline
  # On = the camera automation (not a person) last turned the office lights off.
  office_lights_auto_off:
    name: Office lights last turned off automatically
    icon: mdi:lightbulb-auto-outline
  # Off = the original ai_task check with its 5-minute recheck.
  office_vision_enabled:
    name: Office vision classifier
    icon: mdi:eye-check-outline

input_number:
  office_vision_poll_seconds:
    name: Office vision poll interval
    icon: mdi:timer-outline
    min: 10
    max: 600
    step: 5
    unit_of_measurement: s
  office_vision_absences_required:
    name: Office vision empty checks before lights off
    icon: mdi:counter
    min: 1
    max: 10
    step: 1

input_datetime:
  office_vision_last_poll:
    name: Office vision last poll
    has_date: true
    has_time: true

# Debug record of the office AI presence check (shown on the Office Debug dashboard).
input_select:
  office_presence_state:
    name: Office presence state
    icon: mdi:account-question
    options:
      - unknown
      - motion
      - vision_present
      - vision_absent
  office_ai_last_answer:
    name: Office AI last answer
    icon: mdi:robot-outline
    options:
      - waiting
      - checking
      - person
      - empty
      - error

input_text:
  office_ai_last_reason:
    name: Office AI last reason
    icon: mdi:comment-text-outline
    max: 255
  office_ai_last_source:
    name: Office AI last check source
    icon: mdi:source-branch
    max: 100

counter:
  office_ai_checks_person:
    name: Office AI answers - person
    icon: mdi:account-check
  office_ai_checks_empty:
    name: Office AI answers - empty
    icon: mdi:account-off
  office_ai_checks_error:
    name: Office AI answers - failed
    icon: mdi:alert-circle
  office_vision_absent_streak:
    name: Office vision empty checks in a row
    icon: mdi:account-off-outline
    restore: false

shell_command:
  office_vision_classify: "python3 /config/office_vision/office_vision.py classify --image /media/office_debug/last.jpg --camera office --source '{{ source }}'"

command_line:
  - sensor:
      name: Office Vision Cost
      unique_id: office_vision_cost
      icon: mdi:currency-usd
      command: python3 /config/office_vision/office_vision.py totals
      command_timeout: 20
      scan_interval: 300
      unit_of_measurement: USD
      value_template: "{{ '%.6f' | format(value_json.today | float(0)) }}"
      json_attributes:
        - today
        - week
        - month
        - today_calls
        - week_calls
        - month_calls
        - today_reused
        - daily_limit
        - failures
        - configured_model
        - latest_status
        - latest_summary
        - last_cost
        - last_cost_source
        - last_model
        - last_ts
        - last_input_tokens
        - last_output_tokens
        - last_duration_ms
        - last_width
        - last_height
        - people
        - dog
        - member
        - uncertainty

rest_command:
    lyric_scroll_play:
      url: "http://lyric-scroll.mattmariani.com/api/ma/play"
      method: POST
      content_type: "application/json"
      payload: '{"track": "{{ track }}", "player": "{{ player }}"}'

    # Pocket Sign (sign.dogbelly.app). Display ids: Office TV 027YiRhj,
    # Matts-phone 5UpAsYTj, Pixel 11 MRaS5WKg. Token: !secret pocket_sign_bearer
    # ("Bearer <API_TOKEN>", set with `ha-config secret pocket_sign_bearer`).
    # sign_message: display, text; optional duration (seconds, default 60, 0 = until
    # cleared), level (interrupt|note|rotation), key (e.g. doorbell, now-playing).
    # level and key need Pocket Sign 0.5.0. cast: true also takes over the
    # display's Chromecast (interrupts whatever is playing), so use it sparingly.
    sign_message:
      url: "https://sign.dogbelly.app/api/v1/displays/{{ display }}/message"
      method: POST
      headers:
        Authorization: !secret pocket_sign_bearer
      content_type: "application/json"
      payload: >-
        {% set secs = (duration | default(60)) | int %}
        {% set p = {'text': text} %}
        {% if secs > 0 %}{% set p = dict(p, durationSec=secs) %}{% endif %}
        {% if level is defined %}{% set p = dict(p, level=level) %}{% endif %}
        {% if key is defined %}{% set p = dict(p, key=key) %}{% endif %}
        {% if cast is defined and (cast | string | lower) == 'true' %}{% set p = dict(p, cast=true) %}{% endif %}
        {{ p | tojson }}
    # sign_clear: display, key. Removes that keyed item (Pocket Sign 0.5.0+).
    sign_clear:
      url: "https://sign.dogbelly.app/api/v1/displays/{{ display }}/keys/{{ key }}"
      method: DELETE
      headers:
        Authorization: !secret pocket_sign_bearer

media_player:
    - platform: universal
      name: Lyric Scroll Old Chromecast
      unique_id: lyric_scroll_old_chromecast
      commands:
        play_media:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play_media", "media_content_id": "{{ media_content_id }}",
  "media_content_type": "{{ media_content_type }}"}'
        media_play:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play"}'
        media_pause:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "pause"}'
        media_stop:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "stop"}'
      attributes:
        state: sensor.lyric_scroll_old_chromecast_state
        media_title: sensor.lyric_scroll_old_chromecast_title
        media_artist: sensor.lyric_scroll_old_chromecast_artist
mqtt:
    sensor:
    - name: "Laptop Thermal Object"
      unique_id: "laptop_thermal_object"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.object_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"

    - name: "Laptop Thermal Ambient"
      unique_id: "laptop_thermal_ambient"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.ambient_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"
