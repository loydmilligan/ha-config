rest_command:
    lyric_scroll_play:
      url: "http://lyric-scroll.mattmariani.com/api/ma/play"
      method: POST
      content_type: "application/json"
      payload: '{"track": "{{ track }}", "player": "{{ player }}"}'

    # Pocket Sign (sign.dogbelly.app). Display ids: Office TV 027YiRhj,
    # Matts-phone 5UpAsYTj, Pixel 11 MRaS5WKg. Token: !secret pocket_sign_bearer
    # ("Bearer <API_TOKEN>", set with `ha-config secret pocket_sign_bearer`).
    # sign_message: display, text; optional duration (seconds, default 60, 0 = until
    # cleared), level (interrupt|note|rotation), key (e.g. doorbell, now-playing).
    # level and key need Pocket Sign 0.5.0. cast: true also takes over the
    # display's Chromecast (interrupts whatever is playing), so use it sparingly.
    sign_message:
      url: "https://sign.dogbelly.app/api/v1/displays/{{ display }}/message"
      method: POST
      headers:
        Authorization: !secret pocket_sign_bearer
      content_type: "application/json"
      payload: >-
        {% set secs = (duration | default(60)) | int %}
        {% set p = {'text': text} %}
        {% if secs > 0 %}{% set p = dict(p, durationSec=secs) %}{% endif %}
        {% if level is defined %}{% set p = dict(p, level=level) %}{% endif %}
        {% if key is defined %}{% set p = dict(p, key=key) %}{% endif %}
        {% if cast is defined and (cast | string | lower) == 'true' %}{% set p = dict(p, cast=true) %}{% endif %}
        {{ p | tojson }}
    # sign_clear: display, key. Removes that keyed item (Pocket Sign 0.5.0+).
    sign_clear:
      url: "https://sign.dogbelly.app/api/v1/displays/{{ display }}/keys/{{ key }}"
      method: DELETE
      headers:
        Authorization: !secret pocket_sign_bearer

media_player:
    - platform: universal
      name: Lyric Scroll Old Chromecast
      unique_id: lyric_scroll_old_chromecast
      commands:
        play_media:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play_media", "media_content_id": "{{ media_content_id }}",
  "media_content_type": "{{ media_content_type }}"}'
        media_play:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play"}'
        media_pause:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "pause"}'
        media_stop:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "stop"}'
      attributes:
        state: sensor.lyric_scroll_old_chromecast_state
        media_title: sensor.lyric_scroll_old_chromecast_title
        media_artist: sensor.lyric_scroll_old_chromecast_artist
mqtt:
    sensor:
    - name: "Laptop Thermal Object"
      unique_id: "laptop_thermal_object"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.object_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"

    - name: "Laptop Thermal Ambient"
      unique_id: "laptop_thermal_ambient"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.ambient_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"
