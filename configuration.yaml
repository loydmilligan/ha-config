shell_command:
  # Frame from the wired Nest doorbell via go2rtc on CM4 (~/docker/go2rtc, loopback 127.0.0.1:1984).
  doorbell_frame: "sh -c 'mkdir -p /media/doorbell && for t in 50 8; do curl -sf -m $t -o /media/doorbell/.new.jpg \"http://127.0.0.1:1984/api/frame.jpeg?src=doorbell\" && mv /media/doorbell/.new.jpg /media/doorbell/{{ name }}.jpg && cp /media/doorbell/{{ name }}.jpg /media/doorbell/latest.jpg && exit 0; done; exit 1'"
  office_vision_classify: "python3 /config/office_vision/office_vision.py classify --image /media/office_debug/last.jpg --camera office --source '{{ source }}'"

command_line:
  - sensor:
      name: Office Vision Cost
      unique_id: office_vision_cost
      icon: mdi:currency-usd
      command: python3 /config/office_vision/office_vision.py totals
      command_timeout: 20
      scan_interval: 300
      unit_of_measurement: USD
      value_template: "{{ '%.6f' | format(value_json.today | float(0)) }}"
      json_attributes:
        - today
        - week
        - month
        - today_calls
        - week_calls
        - month_calls
        - today_reused
        - daily_limit
        - failures
        - configured_model
        - latest_status
        - latest_summary
        - last_cost
        - last_cost_source
        - last_model
        - last_ts
        - last_input_tokens
        - last_output_tokens
        - last_duration_ms
        - last_width
        - last_height
        - people
        - dog
        - member
        - uncertainty

rest_command:
    lyric_scroll_play:
      url: "http://lyric-scroll.mattmariani.com/api/ma/play"
      method: POST
      content_type: "application/json"
      payload: '{"track": "{{ track }}", "player": "{{ player }}"}'

    # Pocket Sign (sign.dogbelly.app). Display ids: Office TV 027YiRhj,
    # Matts-phone 5UpAsYTj, Pixel 11 MRaS5WKg. Token: !secret pocket_sign_bearer
    # ("Bearer <API_TOKEN>", set with `ha-config secret pocket_sign_bearer`).
    # sign_message: display, text; optional duration (seconds, default 60, 0 = until
    # cleared), level (interrupt|note|rotation), key (e.g. doorbell, now-playing).
    # level and key need Pocket Sign 0.5.0. cast: true also takes over the
    # display's Chromecast (interrupts whatever is playing), so use it sparingly.
    # Optional look (Pocket Sign 0.6.0+): theme (e.g. neon), mode (e.g. bounce),
    # bounce (rare|perfect). A theme brings its own motion; a mode it doesn't
    # offer is refused.
    # Countdown (Pocket Sign 0.11.0+): countdown (seconds) or countdown_until
    # ("18:00", today or tomorrow if passed; a full ISO time also works). The text
    # becomes the label and the time left shows under it. At zero it flashes
    # done_text (default TIME'S UP!) for hold seconds (default 300, 0 = until
    # cleared), then ends. duration is ignored: the countdown sets its own end.
    # The same key again restarts it.
    sign_message:
      url: "https://sign.dogbelly.app/api/v1/displays/{{ display }}/message"
      method: POST
      headers:
        Authorization: !secret pocket_sign_bearer
      content_type: "application/json"
      payload: >-
        {% set secs = (duration | default(60)) | int %}
        {% set cd = none %}
        {% if countdown is defined %}{% set cd = {'seconds': countdown | int} %}
        {% elif countdown_until is defined %}
          {% if 'T' in (countdown_until | string) %}{% set cd = {'endsAt': countdown_until | string} %}
          {% else %}{% set at = today_at(countdown_until) %}{% if at <= now() %}{% set at = at + timedelta(days=1) %}{% endif %}{% set cd = {'endsAt': at.isoformat()} %}{% endif %}
        {% endif %}
        {% if cd is not none and done_text is defined %}{% set cd = dict(cd, doneText=done_text) %}{% endif %}
        {% if cd is not none and hold is defined %}{% set cd = dict(cd, holdSec=((hold | int) if (hold | int) > 0 else none)) %}{% endif %}
        {% set p = {'text': text} %}
        {% if cd is not none %}{% set p = dict(p, countdown=cd) %}{% elif secs > 0 %}{% set p = dict(p, durationSec=secs) %}{% endif %}
        {% if level is defined %}{% set p = dict(p, level=level) %}{% endif %}
        {% if key is defined %}{% set p = dict(p, key=key) %}{% endif %}
        {% if cast is defined and (cast | string | lower) == 'true' %}{% set p = dict(p, cast=true) %}{% endif %}
        {% if theme is defined %}{% set p = dict(p, themeId=theme) %}{% endif %}
        {% if mode is defined %}{% set p = dict(p, mode=mode) %}{% endif %}
        {% if bounce is defined %}{% set p = dict(p, bounceCorners=bounce) %}{% endif %}
        {{ p | tojson }}
    # sign_clear: display, key. Removes that keyed item (Pocket Sign 0.5.0+).
    sign_clear:
      url: "https://sign.dogbelly.app/api/v1/displays/{{ display }}/keys/{{ key }}"
      method: DELETE
      headers:
        Authorization: !secret pocket_sign_bearer

# HA Manager phone approvals: the emoji to tap in the ntfy approval push. Pulled (read-only)
# from the ham-approvals service on mash-ubie; HA never writes to it. State is e.g. "#19 🦊"
# or "none". Token: !secret ham_challenge_bearer ("Bearer <HAM_CHALLENGE_TOKEN>").
rest:
  - resource: http://192.168.4.217:8840/challenge
    headers:
      Authorization: !secret ham_challenge_bearer
    scan_interval: 15
    timeout: 5
    sensor:
      - name: HAM approval challenge
        unique_id: ham_approval_challenge
        icon: mdi:shield-check-outline
        value_template: "{{ value_json.state }}"
        json_attributes:
          - pending

media_player:
    - platform: universal
      name: Lyric Scroll Old Chromecast
      unique_id: lyric_scroll_old_chromecast
      commands:
        play_media:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play_media", "media_content_id": "{{ media_content_id }}",
  "media_content_type": "{{ media_content_type }}"}'
        media_play:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play"}'
        media_pause:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "pause"}'
        media_stop:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "stop"}'
      attributes:
        state: sensor.lyric_scroll_old_chromecast_state
        media_title: sensor.lyric_scroll_old_chromecast_title
        media_artist: sensor.lyric_scroll_old_chromecast_artist
mqtt:
    sensor:
    - name: "Laptop Thermal Object"
      unique_id: "laptop_thermal_object"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.object_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"

    - name: "Laptop Thermal Ambient"
      unique_id: "laptop_thermal_ambient"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.ambient_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"

template:
  - binary_sensor:
      # On when either office radar sensor sees someone: Everything Presence Lite (NE corner,
      # office floor zone or Matt's desk zone) or the Sonoff mmWave (south wall, aimed at Mara's desk).
      - name: Office presence radar
        unique_id: office_presence_radar
        device_class: occupancy
        state: >-
          {{ is_state('binary_sensor.everything_presence_lite_cadb3c_zone_3_occupancy', 'on')
             or is_state('binary_sensor.everything_presence_lite_cadb3c_zone_1_occupancy', 'on')
             or is_state('binary_sensor.sonoff_mmwave_occupancy', 'on') }}

  # --- House light level (ha-manager task #20) --------------------------------------
  # One brightness target (%) for every automatic light. Interim levels; to be revised
  # after research on healthy light levels (biased dim).
  - sensor:
      - name: House light level
        unique_id: house_light_level
        unit_of_measurement: "%"
        icon: mdi:brightness-auto
        state: >-
          {% if is_state('input_boolean.sleep_mode', 'on') %}3
          {% else %}
            {% set elev = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% if elev > 6 %}100{% elif elev > -6 %}60{% else %}30{% endif %}
          {% endif %}

  # --- Bathroom (ha-manager task #19) -------------------------------------------------
  # Shower: humidity well above its recent baseline (SwitchBot meter 97C8 in the bathroom).
  # Hysteresis: on at baseline + 8 points, off once back within 3 points.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.indoor_outdoor_meter_97c8_humidity
          - sensor.bathroom_humidity_baseline
    binary_sensor:
      - name: Bathroom shower
        unique_id: bathroom_shower
        device_class: moisture
        state: >-
          {% set h = states('sensor.indoor_outdoor_meter_97c8_humidity') | float(none) %}
          {% set b = states('sensor.bathroom_humidity_baseline') | float(none) %}
          {% if h is none or b is none %}{{ this.state == 'on' }}
          {% elif h >= b + 8 %}true
          {% elif h <= b + 3 %}false
          {% else %}{{ this.state == 'on' }}{% endif %}

  # Occupancy, "wasp in a box": motion seen 45 s after the door closed means someone is
  # inside, so the room stays occupied (even motionless in the shower) until the door opens.
  # Door open: follows motion, with a 2 min hold.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.square_multi_sensor_occupancy
        to: "on"
        id: motion
      - trigger: state
        entity_id: binary_sensor.square_multi_sensor_occupancy
        to: "off"
        for: {minutes: 2}
        id: motion_clear
      - trigger: state
        entity_id: binary_sensor.bathroom_contact_sensor_contact
        to: "on"
        id: door_open
      - trigger: state
        entity_id: binary_sensor.bathroom_contact_sensor_contact
        to: "off"
        for: {seconds: 45}
        id: door_closed_settled
      - trigger: state
        entity_id: binary_sensor.bathroom_shower
        to: "on"
        id: shower
    binary_sensor:
      - name: Bathroom occupied
        unique_id: bathroom_occupied
        device_class: occupancy
        state: >-
          {% set motion = is_state('binary_sensor.square_multi_sensor_occupancy', 'on') %}
          {% set door_closed = is_state('binary_sensor.bathroom_contact_sensor_contact', 'off') %}
          {% set inside = this.attributes.get('someone_inside', false) if this.attributes is defined else false %}
          {% if trigger.id in ['motion', 'shower'] %}true
          {% elif trigger.id == 'door_open' %}{{ this.state == 'on' or motion }}
          {% elif trigger.id == 'door_closed_settled' %}{{ motion }}
          {% elif trigger.id == 'motion_clear' %}{{ door_closed and inside }}
          {% else %}{{ this.state == 'on' }}{% endif %}
        attributes:
          someone_inside: >-
            {% set motion = is_state('binary_sensor.square_multi_sensor_occupancy', 'on') %}
            {% set door = states.binary_sensor.bathroom_contact_sensor_contact %}
            {% set closed_45s = door is not none and door.state == 'off'
               and (now() - door.last_changed).total_seconds() >= 45 %}
            {% if trigger.id == 'door_open' %}false
            {% elif trigger.id == 'shower' %}true
            {% elif trigger.id in ['motion', 'door_closed_settled'] and motion and closed_45s %}true
            {% else %}{{ this.attributes.get('someone_inside', false) if this.attributes is defined else false }}{% endif %}

  # Debug only (Debug dashboard > Bathroom): which step of the two bathroom automations we're
  # in, as "<occupancy>.<fan>" (e.g. "inside.running"); picks the highlighted flow diagram.
  - sensor:
      - name: Bathroom automation phase
        unique_id: bathroom_automation_phase
        icon: mdi:state-machine
        state: >-
          {% set occ = states('binary_sensor.bathroom_occupied') %}
          {% set o = 'unknown' if occ not in ['on', 'off'] else ('vacant' if occ == 'off' else
             ('inside' if state_attr('binary_sensor.bathroom_occupied', 'someone_inside') else 'occupied')) %}
          {% set fan = states('switch.bathroom') %}
          {% set f = 'unknown' if fan not in ['on', 'off'] else ('off' if fan == 'off' else
             ('running' if is_state('binary_sensor.bathroom_shower', 'on') else 'on_no_shower')) %}
          {{ o }}.{{ f }}
        attributes:
          label: >-
            {% set occ = states('binary_sensor.bathroom_occupied') %}
            {% set fan = states('switch.bathroom') %}
            {% if occ not in ['on', 'off'] %}Occupancy unknown{% elif occ == 'off' %}Vacant{% elif state_attr('binary_sensor.bathroom_occupied', 'someone_inside') %}Someone inside (door closed){% else %}Occupied (door open){% endif %} · {% if fan not in ['on', 'off'] %}fan unknown{% elif fan == 'off' %}fan off{% elif is_state('binary_sensor.bathroom_shower', 'on') %}shower, fan running{% else %}fan on, no shower{% endif %}

sensor:
  # Recent "normal" bathroom humidity: 20th percentile of the last 3 h, robust to showers.
  - platform: statistics
    name: Bathroom humidity baseline
    unique_id: bathroom_humidity_baseline
    entity_id: sensor.indoor_outdoor_meter_97c8_humidity
    state_characteristic: percentile
    percentile: 20
    max_age:
      hours: 3
    sampling_size: 1000
    precision: 1
