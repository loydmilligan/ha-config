rest_command:
    lyric_scroll_play:
      url: "http://lyric-scroll.mattmariani.com/api/ma/play"
      method: POST
      content_type: "application/json"
      payload: '{"track": "{{ track }}", "player": "{{ player }}"}'

media_player:
    - platform: universal
      name: Lyric Scroll Old Chromecast
      unique_id: lyric_scroll_old_chromecast
      commands:
        play_media:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play_media", "media_content_id": "{{ media_content_id }}",
  "media_content_type": "{{ media_content_type }}"}'
        media_play:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "play"}'
        media_pause:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "pause"}'
        media_stop:
          service: mqtt.publish
          data:
            topic: "lyric_scroll/old_chromecast/command"
            payload: '{"command": "stop"}'
      attributes:
        state: sensor.lyric_scroll_old_chromecast_state
        media_title: sensor.lyric_scroll_old_chromecast_title
        media_artist: sensor.lyric_scroll_old_chromecast_artist
mqtt:
    sensor:
    - name: "Laptop Thermal Object"
      unique_id: "laptop_thermal_object"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.object_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"

    - name: "Laptop Thermal Ambient"
      unique_id: "laptop_thermal_ambient"
      state_topic: "sensors/laptop_thermal/mlx90614"
      value_template: "{{ value_json.ambient_temp_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "sensors/laptop_thermal"
