    name: Office dashboard - show details
    icon: mdi:chevron-down-box-outline
  # Doorbell AI: which of /media/doorbell/a.jpg or b.jpg holds the newest 5-minute frame.
  doorbell_frame_slot:
    name: Doorbell frame slot B
    icon: mdi:swap-horizontal
  doorbell_change_detected:
    name: Doorbell scene changed
    icon: mdi:compare
  pocket_sign_battery_test:
    name: Battery warning test mode
    icon: mdi:battery-alert-variant-outline
  # On = the camera automation (not a person) last turned the office lights off.
  office_lights_auto_off:
    name: Office lights last turned off automatically
    icon: mdi:lightbulb-auto-outline
  # Off = the original ai_task check with its 5-minute recheck.
  office_vision_enabled:
    name: Office vision classifier
    icon: mdi:eye-check-outline
  # Sleep mode: manual for now; the household-state observer (ha-manager task #22) will
  # learn bedtimes and later drive it. Read by sensor.house_light_level (sleep = very dim).
  sleep_mode:
    name: Sleep mode
    icon: mdi:sleep

