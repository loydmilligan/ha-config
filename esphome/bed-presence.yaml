# Bed presence — Adafruit ESP32 Feather V2 + force-sensitive resistors.
#
# People: one SF15-600 (600 mm) under each sleeper's hips.
# Dog: two FSR408 (105 mm) wherever the dog actually lies.
# A mattress spreads weight, so this reports zones, not body weight.
# "Dog only" is true when a dog spot is loaded and both sides are clear.
# A dog on a pillow looks like that side. Feet can load a dog spot
# while someone is in bed; that shows as the side plus the dog spot.
#
# Per channel, unloaded voltage sits near 0 V and rises as force increases:
#
#   3V ---- FSR ----+---- ADC pin
#                   |
#                  47k
#                   |
#                  GND
#
# Use the 3V pin, never USB/5V and never BAT. Power the Feather from USB-C.
# ADC2 pins (A0, A1, A5, and most of the top row) stop working once Wi-Fi
# starts. GPIO35 is the onboard battery divider. Leave both alone.
# D13 is the onboard red LED. Leave it alone.
#
# Spare ADC1 pad, after the same divider is wired. A floating pad will
# false-trigger, so do not add it before then:
#   D37 / GPIO37  (input only, the pad beside TX)
#
# Four WS2812B pixels cut from the roll (color order GRB, 5 V). Do not
# connect the rest of the roll, and do not feed a 6 A supply into the Feather.
#   USB ---- strip 5V
#   GND ---- strip GND
#   D27 ---- 330 ohm ---- DIN, arrow pointing away from the board
# Pixel 0 (closest to the board) is Left, then Right, Dog spot A, Dog spot B.
#
# KY-040 encoder. Power it from 3V, not USB. The switches are 5 V on the
# label, but the ESP32 pins are not 5 V tolerant.
#   +  -> 3V
#   GND -> GND
#   CLK -> D15
#   DT  -> D32
#   SW  -> D14
# Clockwise lowers the selected threshold. If that feels backwards, swap D15 and D32.
#
# Modes, long-press the knob to cycle: Active -> Test -> Edit.
# Short-press in Edit moves to the next sensor. Active paints the strip black.
# Test lights each pixel from that sensor's voltage. Edit lights only the
# selected pixel: red below the threshold, green at or above it.

substitutions:
  name: bed-presence
  baseline_margin: "0.15"
  on_delay: 3s
  off_delay: 20s

esphome:
  name: ${name}
  friendly_name: Bed presence
  on_boot:
    - priority: -100
      then:
        - switch.turn_on: neopixel_power
        - script.execute: apply_mode_lamp
        - light.turn_on:
            id: zone_leds
            effect: Zones

esp32:
  board: adafruit_feather_esp32_v2
  flash_size: 8MB
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret bed_presence_api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

globals:
  # 0 Active, 1 Test, 2 Edit. Not restored, so a reboot stays dark.
  - id: mode_lamp
    type: int
    restore_value: false
    initial_value: "0"
  # Which sensor Edit is adjusting. 0 Left, 1 Right, 2 Dog A, 3 Dog B.
  - id: edit_index
    type: int
    restore_value: false
    initial_value: "0"

script:
  - id: apply_mode_lamp
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(mode_lamp) == 1;"
          then:
            - light.turn_on:
                id: status_led
                brightness: 20%
                red: 0%
                green: 15%
                blue: 100%
          else:
            - if:
                condition:
                  lambda: "return id(mode_lamp) == 2;"
                then:
                  - light.turn_on:
                      id: status_led
                      brightness: 20%
                      red: 100%
                      green: 45%
                      blue: 0%
                else:
                  - light.turn_off: status_led
  - id: cycle_mode
    then:
      - lambda: |-
          std::string next = "Active";
          if (id(mode_lamp) == 0) next = "Test";
          else if (id(mode_lamp) == 1) next = "Edit";
          auto call = id(bed_mode).make_call();
          call.set_option(next);
          call.perform();
          ESP_LOGI("bed", "Mode %s", next.c_str());
  - id: cycle_zone
    then:
      - lambda: |-
          if (id(mode_lamp) != 2) return;
          int next = id(edit_index) + 1;
          if (next > 3) next = 0;
          id(edit_index) = next;
  - id: nudge_threshold
    mode: queued
    parameters:
      step: float
    then:
      - lambda: |-
          if (id(mode_lamp) != 2) return;
          const int idx = id(edit_index);
          float cur;
          if (idx == 0) cur = id(thr_left).state;
          else if (idx == 1) cur = id(thr_right).state;
          else if (idx == 2) cur = id(thr_dog_a).state;
          else cur = id(thr_dog_b).state;
          if (isnan(cur)) cur = 0.60f;
          float next = cur + step;
          if (next < 0.05f) next = 0.05f;
          if (next > 2.80f) next = 2.80f;
          if (idx == 0) {
            auto call = id(thr_left).make_call();
            call.set_value(next);
            call.perform();
          } else if (idx == 1) {
            auto call = id(thr_right).make_call();
            call.set_value(next);
            call.perform();
          } else if (idx == 2) {
            auto call = id(thr_dog_a).make_call();
            call.set_value(next);
            call.perform();
          } else {
            auto call = id(thr_dog_b).make_call();
            call.set_value(next);
            call.perform();
          }

# GPIO2 powers the onboard NeoPixel. High = on. GPIO0 is its data line.
switch:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: neopixel_power
    internal: true
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    id: zone_leds
    internal: true
    pin: GPIO27
    num_leds: 4
    chipset: ws2812
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: Zones
          update_interval: 50ms
          lambda: |-
            const int mode = id(mode_lamp);
            const int selected = id(edit_index);
            for (int i = 0; i < 4; i++) {
              float v;
              float thr;
              if (i == 0) {
                v = id(left_adc).state;
                thr = id(thr_left).state;
              } else if (i == 1) {
                v = id(right_adc).state;
                thr = id(thr_right).state;
              } else if (i == 2) {
                v = id(dog_a_adc).state;
                thr = id(thr_dog_a).state;
              } else {
                v = id(dog_b_adc).state;
                thr = id(thr_dog_b).state;
              }
              if (isnan(v)) v = 0.0f;
              if (isnan(thr)) thr = 0.60f;
              if (mode == 0) {
                it[i] = Color(0, 0, 0);
                continue;
              }
              float span = (v - 0.05f) / 2.2f;
              if (span < 0.0f) span = 0.0f;
              if (span > 1.0f) span = 1.0f;
              int level = (int) (span * 140.0f);
              const bool hot = v >= thr;
              if (mode == 1) {
                if (level < 4) it[i] = Color(0, 0, 0);
                else if (hot) it[i] = Color(0, level, 0);
                else it[i] = Color(level / 3, level / 2, level);
                continue;
              }
              if (i != selected) {
                it[i] = Color(0, 0, 0);
                continue;
              }
              if (level < 40) level = 40;
              if (hot) it[i] = Color(0, level, 0);
              else it[i] = Color(level, 0, 0);
            }

select:
  - platform: template
    name: "Mode"
    id: bed_mode
    icon: mdi:tune-variant
    optimistic: true
    restore_value: false
    initial_option: Active
    options:
      - Active
      - Test
      - Edit
    set_action:
      - lambda: |-
          if (x == "Test") id(mode_lamp) = 1;
          else if (x == "Edit") id(mode_lamp) = 2;
          else id(mode_lamp) = 0;
      - script.execute: apply_mode_lamp

number:
  - platform: template
    name: "Left threshold"
    id: thr_left
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.60
    min_value: 0.05
    max_value: 2.80
    step: 0.01
    unit_of_measurement: V
    mode: slider
  - platform: template
    name: "Right threshold"
    id: thr_right
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.60
    min_value: 0.05
    max_value: 2.80
    step: 0.01
    unit_of_measurement: V
    mode: slider
  - platform: template
    name: "Dog spot A threshold"
    id: thr_dog_a
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.60
    min_value: 0.05
    max_value: 2.80
    step: 0.01
    unit_of_measurement: V
    mode: slider
  - platform: template
    name: "Dog spot B threshold"
    id: thr_dog_b
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.60
    min_value: 0.05
    max_value: 2.80
    step: 0.01
    unit_of_measurement: V
    mode: slider

sensor:
  # A2 — left SF15-600, under the left sleeper's hips.
  - platform: adc
    pin: GPIO34
    id: left_adc
    name: "Left voltage"
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 250ms
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      - delta: 0.01
  # A3 — right SF15-600.
  - platform: adc
    pin: GPIO39
    id: right_adc
    name: "Right voltage"
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 250ms
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      - delta: 0.01
  # A4 — first FSR408.
  - platform: adc
    pin: GPIO36
    id: dog_a_adc
    name: "Dog spot A voltage"
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 250ms
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      - delta: 0.01
  # D33 — second FSR408.
  - platform: adc
    pin: GPIO33
    id: dog_b_adc
    name: "Dog spot B voltage"
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 250ms
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      - delta: 0.01
  # Onboard 200k/200k divider on GPIO35. Meaningful only with a LiPo fitted.
  - platform: adc
    pin: GPIO35
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 2.0
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: rotary_encoder
    id: knob
    name: "Knob"
    internal: true
    pin_a:
      number: GPIO15
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    pin_b:
      number: GPIO32
      mode:
        input: true
        pullup: true
    resolution: 1
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - script.execute:
          id: nudge_threshold
          step: -0.02
    on_anticlockwise:
      - script.execute:
          id: nudge_threshold
          step: 0.02

binary_sensor:
  - platform: gpio
    id: knob_button
    name: "Knob button"
    internal: true
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      - min_length: 40ms
        max_length: 450ms
        then:
          - script.execute: cycle_zone
      - min_length: 600ms
        max_length: 4s
        then:
          - script.execute: cycle_mode

  - platform: gpio
    id: baseline_button
    name: "Set empty baseline"
    # Input-only pad. The Feather has its own pull-up; the chip cannot.
    pin:
      number: GPIO38
      inverted: true
      mode: INPUT
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Empty-bed capture left=%.3f right=%.3f dog_a=%.3f dog_b=%.3f"
            args: ['id(left_adc).state', 'id(right_adc).state', 'id(dog_a_adc).state', 'id(dog_b_adc).state']
        - number.set:
            id: thr_left
            value: !lambda |-
              const float v = id(left_adc).state;
              if (isnan(v)) return isnan(id(thr_left).state) ? 0.60f : id(thr_left).state;
              return std::min(2.80f, std::max(0.10f, v + ${baseline_margin}f));
        - number.set:
            id: thr_right
            value: !lambda |-
              const float v = id(right_adc).state;
              if (isnan(v)) return isnan(id(thr_right).state) ? 0.60f : id(thr_right).state;
              return std::min(2.80f, std::max(0.10f, v + ${baseline_margin}f));
        - number.set:
            id: thr_dog_a
            value: !lambda |-
              const float v = id(dog_a_adc).state;
              if (isnan(v)) return isnan(id(thr_dog_a).state) ? 0.60f : id(thr_dog_a).state;
              return std::min(2.80f, std::max(0.10f, v + ${baseline_margin}f));
        - number.set:
            id: thr_dog_b
            value: !lambda |-
              const float v = id(dog_b_adc).state;
              if (isnan(v)) return isnan(id(thr_dog_b).state) ? 0.60f : id(thr_dog_b).state;
              return std::min(2.80f, std::max(0.10f, v + ${baseline_margin}f));
        - light.turn_on:
            id: status_led
            brightness: 15%
            red: 0%
            green: 100%
            blue: 0%
        - delay: 200ms
        - light.turn_off: status_led
        - delay: 150ms
        - light.turn_on:
            id: status_led
            brightness: 15%
            red: 0%
            green: 100%
            blue: 0%
        - delay: 200ms
        - script.execute: apply_mode_lamp

  - platform: analog_threshold
    id: zone_left
    name: "Left occupied"
    device_class: occupancy
    icon: mdi:bed
    sensor_id: left_adc
    threshold:
      upper: !lambda |-
        const float t = id(thr_left).state;
        return isnan(t) ? 0.60f : t;
      lower: !lambda |-
        const float t = id(thr_left).state;
        const float upper = isnan(t) ? 0.60f : t;
        return std::max(0.02f, upper - 0.05f);
    filters:
      - delayed_on: ${on_delay}
      - delayed_off: ${off_delay}

  - platform: analog_threshold
    id: zone_right
    name: "Right occupied"
    device_class: occupancy
    icon: mdi:bed
    sensor_id: right_adc
    threshold:
      upper: !lambda |-
        const float t = id(thr_right).state;
        return isnan(t) ? 0.60f : t;
      lower: !lambda |-
        const float t = id(thr_right).state;
        const float upper = isnan(t) ? 0.60f : t;
        return std::max(0.02f, upper - 0.05f);
    filters:
      - delayed_on: ${on_delay}
      - delayed_off: ${off_delay}

  - platform: analog_threshold
    id: zone_dog_a
    name: "Dog spot A"
    device_class: occupancy
    icon: mdi:paw
    sensor_id: dog_a_adc
    threshold:
      upper: !lambda |-
        const float t = id(thr_dog_a).state;
        return isnan(t) ? 0.60f : t;
      lower: !lambda |-
        const float t = id(thr_dog_a).state;
        const float upper = isnan(t) ? 0.60f : t;
        return std::max(0.02f, upper - 0.05f);
    filters:
      - delayed_on: ${on_delay}
      - delayed_off: ${off_delay}

  - platform: analog_threshold
    id: zone_dog_b
    name: "Dog spot B"
    device_class: occupancy
    icon: mdi:paw
    sensor_id: dog_b_adc
    threshold:
      upper: !lambda |-
        const float t = id(thr_dog_b).state;
        return isnan(t) ? 0.60f : t;
      lower: !lambda |-
        const float t = id(thr_dog_b).state;
        const float upper = isnan(t) ? 0.60f : t;
        return std::max(0.02f, upper - 0.05f);
    filters:
      - delayed_on: ${on_delay}
      - delayed_off: ${off_delay}

  - platform: template
    name: "Occupied"
    id: bed_occupied
    device_class: occupancy
    icon: mdi:bed
    lambda: |-
      return id(zone_left).state || id(zone_right).state || id(zone_dog_a).state || id(zone_dog_b).state;

  - platform: template
    name: "Dog only"
    id: dog_only
    device_class: occupancy
    icon: mdi:dog
    lambda: |-
      const bool foot = id(zone_dog_a).state || id(zone_dog_b).state;
      return foot && !id(zone_left).state && !id(zone_right).state;

text_sensor:
  - platform: template
    name: "Who"
    icon: mdi:account-multiple
    update_interval: 1s
    lambda: |-
      const bool left = id(zone_left).state;
      const bool right = id(zone_right).state;
      const bool foot = id(zone_dog_a).state || id(zone_dog_b).state;
      if (!left && !right && !foot) return {"Empty"};
      if (left && right && foot) return {"Both sides and dog spot"};
      if (left && right) return {"Both sides"};
      if (left && foot) return {"Left side and dog spot"};
      if (right && foot) return {"Right side and dog spot"};
      if (left) return {"Left side"};
      if (right) return {"Right side"};
      return {"Dog"};
  - platform: template
    name: "Editing"
    icon: mdi:crosshairs
    update_interval: 250ms
    lambda: |-
      if (id(mode_lamp) != 2) return {"-"};
      switch ((int) id(edit_index)) {
        case 0: return {"Left"};
        case 1: return {"Right"};
        case 2: return {"Dog spot A"};
        default: return {"Dog spot B"};
      }
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
