# Bed presence — Adafruit ESP32 Feather V2 + one force-sensitive resistor.
#
# One sensor is wired (2026-11-25): a long SF15-600 strip on A2 (GPIO34,
# socket hole C7 on the protoboard). The firmware reads only that pin.
# A3, A4 and D33 are not read, so an empty or floating pad cannot report
# someone in bed. To add a sensor later, wire it with its own 47k and
# bring its channel back from git history (the commit before this change).
# A mattress spreads weight, so this reports occupied or not, not weight.
#
# Unloaded voltage sits near 0 V and rises as force increases:
#
#   3V ---- FSR ----+---- ADC pin
#                   |
#                  47k
#                   |
#                  GND
#
# Use the 3V pin, never USB/5V and never BAT. Power the Feather from USB-C.
# ADC2 pins (A0, A1, A5, and most of the top row) stop working once Wi-Fi
# starts. GPIO35 is the onboard battery divider. Leave both alone.
# D13 is the onboard red LED. Leave it alone.
#
# Four WS2812B pixels cut from the roll (color order GRB, 5 V). Do not
# connect the rest of the roll, and do not feed a 6 A supply into the Feather.
#   USB ---- strip 5V
#   GND ---- strip GND
#   D27 ---- 330 ohm ---- DIN, arrow pointing away from the board
# All four pixels show the one sensor.
#
# KY-040 encoder. Power it from 3V, not USB. The switches are 5 V on the
# label, but the ESP32 pins are not 5 V tolerant.
#   +  -> 3V
#   GND -> GND
#   CLK -> D15
#   DT  -> D32
#   SW  -> D14
# Knob modes (2026-11-25). Hold the knob about 1 s to step to the next one:
#   Lights      dim blue. Turn = bedroom light brightness, tap = toggle.
#   Volume      green bar that fills from zero. Turn = volume, tap = next speaker.
#   Sleep timer pink, breathing. Turn = 0/15/30/45/60 min, tap = confirm.
#               0 means sleep mode now (or cancel a running timer).
# The strip goes dark after 10 s without a touch. Volume and Sleep timer fall
# back to Lights after 90 s.
#
# The bed sensor is set up from Home Assistant only (device page, Configuration):
#   Threshold           the voltage that counts as someone in bed
#   Calibration LEDs    strip shows the sensor: blue under the threshold, green
#                       over. Turns itself off after 10 minutes.
#   Capture empty bed   sets the threshold just above the current reading.
#                       The SW38 button on the board does the same.
# The knob never changes the threshold.
#
# The board does not control anything itself. It fires the Home Assistant event
# esphome.bed_knob (mode, action, steps, level) and packages/bed_knob.yaml in
# ha-config decides what happens. Levels shown on the strip come back from
# Home Assistant sensors.

substitutions:
  name: bed-presence
  baseline_margin: "0.15"
  on_delay: 3s
  off_delay: 20s

esphome:
  name: ${name}
  friendly_name: Bed presence
  on_boot:
    - priority: -100
      then:
        - switch.turn_on: neopixel_power
        - script.execute: apply_mode_lamp
        - light.turn_on:
            id: zone_leds
            effect: Zones

esp32:
  board: adafruit_feather_esp32_v2
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret bed_presence_api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

# Bluetooth proxy (added 2026-11-24): relays nearby Bluetooth devices to Home
# Assistant, first of all the laundry back door SwitchBot contact sensor.
# The proxy moves with this board, so it leaves the laundry room when the
# board goes under the bed.
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

globals:
  # 0 Lights, 1 Volume, 2 Sleep timer. Not restored: a reboot starts in Lights.
  - id: mode_lamp
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_turn_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: anim_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: flash_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: ack_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: pending_steps
    type: int
    restore_value: false
    initial_value: "0"
  # Local copies of the levels, so the strip follows the knob without waiting for Home Assistant.
  - id: lights_local
    type: int
    restore_value: false
    initial_value: "0"
  - id: vol_local
    type: int
    restore_value: false
    initial_value: "0"
  # Sleep timer choice: 0 = now, 1..4 = 15..60 minutes.
  - id: sleep_pick
    type: int
    restore_value: false
    initial_value: "0"
  - id: calib_on_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: hold_fired
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: apply_mode_lamp
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: calib_leds
          then:
            - light.turn_on:
                id: status_led
                brightness: 20%
                red: 0%
                green: 15%
                blue: 100%
          else:
            - light.turn_off: status_led
  - id: capture_baseline
    mode: single
    then:
      - logger.log:
          level: INFO
          format: "Empty-bed capture %.3f V"
          args: ['id(bed_adc).state']
      - number.set:
          id: thr_bed
          value: !lambda |-
            const float v = id(bed_adc).state;
            if (isnan(v)) return isnan(id(thr_bed).state) ? 0.60f : id(thr_bed).state;
            return std::min(2.80f, std::max(0.10f, v + ${baseline_margin}f));
      - light.turn_on:
          id: status_led
          brightness: 15%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 200ms
      - light.turn_off: status_led
      - delay: 150ms
      - light.turn_on:
          id: status_led
          brightness: 15%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 200ms
      - script.execute: apply_mode_lamp
  - id: go_mode
    mode: queued
    parameters:
      option: string
    then:
      - lambda: |-
          auto call = id(bed_mode).make_call();
          call.set_option(option);
          call.perform();
          ESP_LOGI("bed", "Mode %s", option.c_str());
  - id: send_knob
    mode: queued
    parameters:
      action_name: string
      steps: int
      level: int
    then:
      - homeassistant.event:
          event: esphome.bed_knob
          data:
            mode: !lambda |-
              if (id(mode_lamp) == 1) return std::string("volume");
              if (id(mode_lamp) == 2) return std::string("sleep");
              return std::string("lights");
            action: !lambda "return action_name;"
            steps: !lambda "return std::to_string(steps);"
            level: !lambda "return std::to_string(level);"
  # Collects fast clicks for 150 ms, then sends them as one event.
  - id: flush_turn
    mode: single
    then:
      - delay: 150ms
      - lambda: |-
          const int steps = id(pending_steps);
          id(pending_steps) = 0;
          if (steps == 0) return;
          const int level = id(mode_lamp) == 1 ? id(vol_local) : id(lights_local);
          id(send_knob).execute("turn", steps, level);
  - id: knob_turn
    mode: queued
    parameters:
      dir: int
    then:
      - lambda: |-
          const uint32_t now = millis();
          id(last_activity_ms) = now;
          const int m = id(mode_lamp);
          id(last_turn_ms) = now;
          if (m == 2) {
            int pick = id(sleep_pick) + dir;
            if (pick < 0) pick = 0;
            if (pick > 4) pick = 4;
            id(sleep_pick) = pick;
            return;
          }
          if (m == 0) {
            int v = id(lights_local) + dir * 8;
            id(lights_local) = v < 0 ? 0 : (v > 100 ? 100 : v);
          } else {
            int v = id(vol_local) + dir * 5;
            id(vol_local) = v < 0 ? 0 : (v > 100 ? 100 : v);
          }
          id(pending_steps) += dir;
          if (!id(flush_turn).is_running()) id(flush_turn).execute();
  - id: knob_tap
    then:
      - lambda: |-
          const uint32_t now = millis();
          id(last_activity_ms) = now;
          const int m = id(mode_lamp);
          if (m == 0 || m == 1) {
            id(send_knob).execute("tap", 0, 0);
          } else if (m == 2) {
            id(send_knob).execute("confirm", 0, id(sleep_pick) * 15);
            id(ack_ms) = now;
            id(sleep_pick) = 0;
          }
  # Runs while the knob is held. After 0.6 s it steps to the next mode.
  - id: hold_watch
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            binary_sensor.is_on: knob_button
          then:
            - lambda: |-
                id(hold_fired) = true;
                const int m = id(mode_lamp);
                std::string next = "Lights";
                if (m == 0) next = "Volume";
                else if (m == 1) next = "Sleep timer";
                id(go_mode).execute(next);

switch:
  - platform: template
    name: "Calibration LEDs"
    id: calib_leds
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: "id(calib_on_ms) = millis();"
      - script.execute: apply_mode_lamp
    on_turn_off:
      - script.execute: apply_mode_lamp
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: neopixel_power
    internal: true
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    id: zone_leds
    internal: true
    pin: GPIO27
    num_leds: 4
    chipset: ws2812
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: Zones
          update_interval: 30ms
          lambda: |-
            const uint32_t now = millis();
            const int mode = id(mode_lamp);
            const uint32_t idle = now - id(last_activity_ms);
            // Dimmer while the house is in sleep mode.
            const float dim = id(ha_sleep_mode).state ? 0.45f : 1.0f;
            auto px = [&](int i, float r, float g, float b) {
              it[i] = Color((uint8_t) (r * dim), (uint8_t) (g * dim), (uint8_t) (b * dim));
            };
            // Level 0..100 across four pixels. The leading pixel fades in, so the bar grows smoothly.
            auto bar = [&](float level, float r, float g, float b, float fr, float fg, float fb) {
              const float f = level / 25.0f;
              for (int i = 0; i < 4; i++) {
                float k = f - i;
                if (k < 0.0f) k = 0.0f;
                if (k > 1.0f) k = 1.0f;
                k = k * k;
                px(i, fr + (r - fr) * k, fg + (g - fg) * k, fb + (b - fb) * k);
              }
            };

            if (id(calib_leds).state) {
              // Calibration: all four pixels show the one sensor.
              float v = id(bed_adc).state;
              float thr = id(thr_bed).state;
              if (isnan(v)) v = 0.0f;
              if (isnan(thr)) thr = 0.60f;
              float span = (v - 0.05f) / 2.2f;
              if (span < 0.0f) span = 0.0f;
              if (span > 1.0f) span = 1.0f;
              int level = (int) (span * 140.0f);
              if (level < 12) level = 12;
              const Color c = v >= thr ? Color(0, level, 0) : Color(level / 3, level / 2, level);
              for (int i = 0; i < 4; i++) it[i] = c;
              return;
            }

            if (idle > 10000) {
              for (int i = 0; i < 4; i++) it[i] = Color(0, 0, 0);
              return;
            }

            if (mode == 0) {
              // Lights: dim blue, or a brightness bar just after a turn.
              if (now - id(last_turn_ms) < 2500) bar((float) id(lights_local), 50, 80, 170, 0, 0, 6);
              else for (int i = 0; i < 4; i++) px(i, 0, 0, 14);
              return;
            }

            if (mode == 1) {
              // Volume: a flash shows which speaker is selected, then the bar fills from zero.
              if (now - id(flash_ms) < 700) {
                const float s = id(ha_speaker_index).state;
                const int idx = isnan(s) ? 0 : (int) s;
                const float pulse = 0.5f + 0.5f * cosf((now - id(flash_ms)) * 0.018f);
                for (int i = 0; i < 4; i++) {
                  if (idx == 0) px(i, 40 * pulse, 170 * pulse, 70 * pulse);
                  else if (i == idx - 1) px(i, 110, 255, 170);
                  else px(i, 0, 0, 0);
                }
                return;
              }
              const int32_t t = (int32_t) (now - id(anim_start_ms));
              float grow = t <= 0 ? 0.0f : (t >= 1200 ? 1.0f : t / 1200.0f);
              grow = grow * grow * (3.0f - 2.0f * grow);
              bar((float) id(vol_local) * grow, 0, 150, 20, 0, 4, 0);
              return;
            }

            // Sleep timer: pink, breathing.
            if (now - id(ack_ms) < 450) {
              const bool on = ((now - id(ack_ms)) / 150) % 2 == 0;
              for (int i = 0; i < 4; i++) px(i, on ? 150 : 0, on ? 150 : 0, on ? 150 : 0);
              return;
            }
            const float breath = 0.22f + 0.78f * (0.5f - 0.5f * cosf(now * 0.0018f));
            int n = id(sleep_pick);
            const float mins = id(ha_sleep_minutes).state;
            if (n == 0 && now - id(last_turn_ms) > 4000 && !isnan(mins) && mins > 0.0f) {
              // A timer is running: show what is left, one pixel per 15 minutes.
              n = (int) ((mins + 14.0f) / 15.0f);
              if (n > 4) n = 4;
            }
            for (int i = 0; i < 4; i++) {
              if (n == 0 || i < n) px(i, 255 * breath, 40 * breath, 110 * breath);
              else px(i, 7, 0, 3);
            }

select:
  - platform: template
    name: "Mode"
    id: bed_mode
    icon: mdi:tune-variant
    optimistic: true
    restore_value: false
    initial_option: Lights
    options:
      - Lights
      - Volume
      - Sleep timer
    set_action:
      - lambda: |-
          const uint32_t now = millis();
          int m = 0;
          if (x == "Volume") m = 1;
          else if (x == "Sleep timer") m = 2;
          id(mode_lamp) = m;
          id(last_activity_ms) = now;
          id(sleep_pick) = 0;
          if (m == 1) id(anim_start_ms) = now;
      - script.execute: apply_mode_lamp

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t idle = now - id(last_activity_ms);
          const int m = id(mode_lamp);
          // Left alone, the knob goes back to Lights.
          if ((m == 1 || m == 2) && idle > 90000) {
            id(go_mode).execute("Lights");
          }
          // When the knob is still, take the real levels from Home Assistant.
          if (now - id(last_turn_ms) > 2500) {
            const float l = id(ha_lights_level).state;
            const float v = id(ha_volume_level).state;
            if (!isnan(l)) id(lights_local) = (int) l;
            if (!isnan(v)) id(vol_local) = (int) v;
          }
          if (idle > 10000) id(sleep_pick) = 0;
          // Calibration LEDs switch themselves off after 10 minutes.
          if (id(calib_leds).state && now - id(calib_on_ms) > 600000) id(calib_leds).turn_off();

button:
  - platform: template
    name: "Capture empty bed"
    icon: mdi:bed-empty
    entity_category: config
    on_press:
      - script.execute: capture_baseline

number:
  - platform: template
    name: "Threshold"
    id: thr_bed
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.60
    min_value: 0.05
    max_value: 2.80
    step: 0.01
    unit_of_measurement: V
    mode: slider

sensor:
  # A2 (GPIO34, protoboard socket hole C7) — the one SF15-600. Matt confirmed the pin
  # by eye on 2026-11-26. D33 is not connected and floats, so its readings mean nothing.
  - platform: adc
    pin: GPIO34
    id: bed_adc
    name: "Voltage"
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 250ms
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      - delta: 0.01
  # Onboard 200k/200k divider on GPIO35. Meaningful only with a LiPo fitted.
  - platform: adc
    pin: GPIO35
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 2.0
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
  # Values read back from Home Assistant, for the strip.
  - platform: homeassistant
    id: ha_lights_level
    entity_id: sensor.bed_knob_lights_level
    internal: true
  - platform: homeassistant
    id: ha_volume_level
    entity_id: sensor.bed_knob_volume_level
    internal: true
  - platform: homeassistant
    id: ha_speaker_index
    entity_id: sensor.bed_knob_speaker_index
    internal: true
    on_value:
      - lambda: |-
          id(flash_ms) = millis();
          id(anim_start_ms) = millis() + 700;
  - platform: homeassistant
    id: ha_sleep_minutes
    entity_id: sensor.bed_sleep_timer_minutes
    internal: true
  - platform: rotary_encoder
    id: knob
    name: "Knob"
    internal: true
    pin_a:
      number: GPIO15
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    pin_b:
      number: GPIO32
      mode:
        input: true
        pullup: true
    resolution: 1
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - script.execute:
          id: knob_turn
          dir: 1
    on_anticlockwise:
      - script.execute:
          id: knob_turn
          dir: -1

binary_sensor:
  - platform: homeassistant
    id: ha_sleep_mode
    entity_id: input_boolean.sleep_mode
    internal: true
  - platform: gpio
    id: knob_button
    name: "Knob button"
    internal: true
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - lambda: |-
          id(hold_fired) = false;
          id(last_activity_ms) = millis();
      - script.execute: hold_watch
    on_release:
      - script.stop: hold_watch
      - if:
          condition:
            lambda: "return !id(hold_fired);"
          then:
            - script.execute: knob_tap

  - platform: gpio
    id: baseline_button
    name: "Empty-bed button (SW38)"
    entity_category: diagnostic
    # Input-only pad. The Feather has its own pull-up; the chip cannot.
    pin:
      number: GPIO38
      inverted: true
      mode: INPUT
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - script.execute: capture_baseline

  - platform: analog_threshold
    id: bed_occupied
    name: "Occupied"
    device_class: occupancy
    icon: mdi:bed
    sensor_id: bed_adc
    threshold:
      upper: !lambda |-
        const float t = id(thr_bed).state;
        return isnan(t) ? 0.60f : t;
      lower: !lambda |-
        const float t = id(thr_bed).state;
        const float upper = isnan(t) ? 0.60f : t;
        return std::max(0.02f, upper - 0.05f);
    filters:
      - delayed_on: ${on_delay}
      - delayed_off: ${off_delay}

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
