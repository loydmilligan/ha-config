# Bed presence — Adafruit ESP32 Feather V2 + one force-sensitive resistor.
#
# One sensor is wired (2026-11-25): a long SF15-600 strip on A2 (GPIO34,
# socket hole C7 on the protoboard). The firmware reads only that pin.
# A3, A4 and D33 are not read, so an empty or floating pad cannot report
# someone in bed. To add a sensor later, wire it with its own 47k and
# bring its channel back from git history (the commit before this change).
# A mattress spreads weight, so this reports occupied or not, not weight.
#
# Unloaded voltage sits near 0 V and rises as force increases:
#
#   3V ---- FSR ----+---- ADC pin
#                   |
#                  47k
#                   |
#                  GND
#
# Use the 3V pin, never USB/5V and never BAT. Power the Feather from USB-C.
# ADC2 pins (A0, A1, A5, and most of the top row) stop working once Wi-Fi
# starts. GPIO35 is the onboard battery divider. Leave both alone.
# D13 is the onboard red LED. Leave it alone.
#
# Four WS2812B pixels cut from the roll (color order GRB, 5 V). Do not
# connect the rest of the roll, and do not feed a 6 A supply into the Feather.
#   USB ---- strip 5V
#   GND ---- strip GND
#   D27 ---- 330 ohm ---- DIN, arrow pointing away from the board
# All four pixels show the one sensor.
#
# KY-040 encoder. Power it from 3V, not USB. The switches are 5 V on the
# label, but the ESP32 pins are not 5 V tolerant.
#   +  -> 3V
#   GND -> GND
#   CLK -> D15
#   DT  -> D32
#   SW  -> D14
# Clockwise lowers the threshold. If that feels backwards, swap D15 and D32.
#
# Modes, long-press the knob to cycle: Active -> Test -> Edit.
# Active paints the strip black. Test lights the strip from the sensor's
# voltage: blue under the threshold, green at or above it. Edit lights it
# red below the threshold and green at or above it, and the knob moves
# the threshold.

substitutions:
  name: bed-presence
  baseline_margin: "0.15"
  on_delay: 3s
  off_delay: 20s

esphome:
  name: ${name}
  friendly_name: Bed presence
  on_boot:
    - priority: -100
      then:
        - switch.turn_on: neopixel_power
        - script.execute: apply_mode_lamp
        - light.turn_on:
            id: zone_leds
            effect: Zones

esp32:
  board: adafruit_feather_esp32_v2
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret bed_presence_api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

# Bluetooth proxy (added 2026-11-24): relays nearby Bluetooth devices to Home
# Assistant, first of all the laundry back door SwitchBot contact sensor.
# The proxy moves with this board, so it leaves the laundry room when the
# board goes under the bed.
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

globals:
  # 0 Active, 1 Test, 2 Edit. Not restored, so a reboot stays dark.
  - id: mode_lamp
    type: int
    restore_value: false
    initial_value: "0"

script:
  - id: apply_mode_lamp
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(mode_lamp) == 1;"
          then:
            - light.turn_on:
                id: status_led
                brightness: 20%
                red: 0%
                green: 15%
                blue: 100%
          else:
            - if:
                condition:
                  lambda: "return id(mode_lamp) == 2;"
                then:
                  - light.turn_on:
                      id: status_led
                      brightness: 20%
                      red: 100%
                      green: 45%
                      blue: 0%
                else:
                  - light.turn_off: status_led
  - id: cycle_mode
    then:
      - lambda: |-
          std::string next = "Active";
          if (id(mode_lamp) == 0) next = "Test";
          else if (id(mode_lamp) == 1) next = "Edit";
          auto call = id(bed_mode).make_call();
          call.set_option(next);
          call.perform();
          ESP_LOGI("bed", "Mode %s", next.c_str());
  - id: nudge_threshold
    mode: queued
    parameters:
      step: float
    then:
      - lambda: |-
          if (id(mode_lamp) != 2) return;
          float cur = id(thr_bed).state;
          if (isnan(cur)) cur = 0.60f;
          float next = cur + step;
          if (next < 0.05f) next = 0.05f;
          if (next > 2.80f) next = 2.80f;
          auto call = id(thr_bed).make_call();
          call.set_value(next);
          call.perform();

# GPIO2 powers the onboard NeoPixel. High = on. GPIO0 is its data line.
switch:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: neopixel_power
    internal: true
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    id: zone_leds
    internal: true
    pin: GPIO27
    num_leds: 4
    chipset: ws2812
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: Zones
          update_interval: 50ms
          lambda: |-
            const int mode = id(mode_lamp);
            float v = id(bed_adc).state;
            float thr = id(thr_bed).state;
            if (isnan(v)) v = 0.0f;
            if (isnan(thr)) thr = 0.60f;
            float span = (v - 0.05f) / 2.2f;
            if (span < 0.0f) span = 0.0f;
            if (span > 1.0f) span = 1.0f;
            int level = (int) (span * 140.0f);
            const bool hot = v >= thr;
            Color c = Color(0, 0, 0);
            if (mode == 1) {
              if (level < 4) c = Color(0, 0, 0);
              else if (hot) c = Color(0, level, 0);
              else c = Color(level / 3, level / 2, level);
            } else if (mode == 2) {
              if (level < 40) level = 40;
              c = hot ? Color(0, level, 0) : Color(level, 0, 0);
            }
            for (int i = 0; i < 4; i++) it[i] = c;

select:
  - platform: template
    name: "Mode"
    id: bed_mode
    icon: mdi:tune-variant
    optimistic: true
    restore_value: false
    initial_option: Active
    options:
      - Active
      - Test
      - Edit
    set_action:
      - lambda: |-
          if (x == "Test") id(mode_lamp) = 1;
          else if (x == "Edit") id(mode_lamp) = 2;
          else id(mode_lamp) = 0;
      - script.execute: apply_mode_lamp

number:
  - platform: template
    name: "Threshold"
    id: thr_bed
    icon: mdi:tune
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.60
    min_value: 0.05
    max_value: 2.80
    step: 0.01
    unit_of_measurement: V
    mode: slider

sensor:
  # A2 (GPIO34, protoboard socket hole C7) — the one SF15-600.
  - platform: adc
    pin: GPIO34
    id: bed_adc
    name: "Voltage"
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 250ms
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      - delta: 0.01
  # Onboard 200k/200k divider on GPIO35. Meaningful only with a LiPo fitted.
  - platform: adc
    pin: GPIO35
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 2.0
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: rotary_encoder
    id: knob
    name: "Knob"
    internal: true
    pin_a:
      number: GPIO15
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    pin_b:
      number: GPIO32
      mode:
        input: true
        pullup: true
    resolution: 1
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - script.execute:
          id: nudge_threshold
          step: -0.02
    on_anticlockwise:
      - script.execute:
          id: nudge_threshold
          step: 0.02

binary_sensor:
  - platform: gpio
    id: knob_button
    name: "Knob button"
    internal: true
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      - min_length: 600ms
        max_length: 4s
        then:
          - script.execute: cycle_mode

  - platform: gpio
    id: baseline_button
    name: "Set empty baseline"
    # Input-only pad. The Feather has its own pull-up; the chip cannot.
    pin:
      number: GPIO38
      inverted: true
      mode: INPUT
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "Empty-bed capture %.3f V"
            args: ['id(bed_adc).state']
        - number.set:
            id: thr_bed
            value: !lambda |-
              const float v = id(bed_adc).state;
              if (isnan(v)) return isnan(id(thr_bed).state) ? 0.60f : id(thr_bed).state;
              return std::min(2.80f, std::max(0.10f, v + ${baseline_margin}f));
        - light.turn_on:
            id: status_led
            brightness: 15%
            red: 0%
            green: 100%
            blue: 0%
        - delay: 200ms
        - light.turn_off: status_led
        - delay: 150ms
        - light.turn_on:
            id: status_led
            brightness: 15%
            red: 0%
            green: 100%
            blue: 0%
        - delay: 200ms
        - script.execute: apply_mode_lamp

  - platform: analog_threshold
    id: bed_occupied
    name: "Occupied"
    device_class: occupancy
    icon: mdi:bed
    sensor_id: bed_adc
    threshold:
      upper: !lambda |-
        const float t = id(thr_bed).state;
        return isnan(t) ? 0.60f : t;
      lower: !lambda |-
        const float t = id(thr_bed).state;
        const float upper = isnan(t) ? 0.60f : t;
        return std::max(0.02f, upper - 0.05f);
    filters:
      - delayed_on: ${on_delay}
      - delayed_off: ${off_delay}

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
