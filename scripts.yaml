get_now_playing_track_name:
  mode: queued
  alias: Get Now Playing Track Name
  sequence:
  - action: music_assistant.get_queue
    data:
      entity_id: media_player.old_chromecast_2
    response_variable: queue_info
  - data:
      entity_id: input_text.now_playing
      value: '{{ queue_info[''media_player.old_chromecast_2''].current_item.name }}'
    action: input_text.set_value
  description: ''
get_next_up_tracks:
  mode: queued
  alias: Get Next Up Tracks
  sequence:
  - action: music_assistant.get_queue
    data:
      entity_id: media_player.old_chromecast_2
    response_variable: queue_info
  - variables:
      q: '{{ queue_info[''media_player.old_chromecast_2''] }}'
      next_item: '{{ q.next_item if q.next_item is defined else None }}'
      next_text: "{% if next_item %}\n  {{ next_item.media_item.name }}\n  {% if next_item.media_item.artists
        is defined\n        and next_item.media_item.artists|length > 0 %}\n    -
        {{ next_item.media_item.artists[0].name }}\n  {% endif %}\n{% else %}\n  No
        upcoming items in queue.\n{% endif %}\n"
  - data:
      entity_id: input_text.next_up
      value: '{{ next_text | trim }}'
    action: input_text.set_value
cast_lyrics_dashboard:
  alias: Cast Lyrics Dashboard
  description: Mutes Chromecast, casts the lyrics dashboard, then unmutes
  sequence:
  - action: media_player.volume_mute
    data:
      is_volume_muted: true
      entity_id: media_player.chromecast_device
  - action: media_player.turn_on
    data: {}
    target:
      device_id: fff6ca4338ea53153995aa1ceff94bbe
  - delay: 00:00:02
  - action: cast.show_lovelace_view
    data:
      entity_id: media_player.old_chromecast
      dashboard_path: dashboard-lyrics
      view_path: music
  - delay: 00:00:10
  - action: media_player.volume_mute
    data:
      is_volume_muted: false
    target:
      device_id: fff6ca4338ea53153995aa1ceff94bbe
  

play_to_lyric_scroll:
      alias: "Play to Lyric Scroll"
      sequence:
        - service: rest_command.lyric_scroll_play
          data:
            track: "{{ track }}"
            player: "media_player.old_chromecast"
office_presence_check:
  alias: Office presence check (AI)
  description: Sends one office camera snapshot to the AI, records the answer for the Office Debug dashboard, and returns whether a person is in the room.
  icon: mdi:account-search
  mode: parallel
  fields:
    source:
      description: What asked for this check (shown on the dashboard).
      example: motion check 1 of 12
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.office_vision_enabled
      state: 'on'
    then:
    - action: script.office_vision_check
      data:
        source: "{{ source | default('manual') }}"
      response_variable: vision_result
    - stop: Answered by the vision classifier
      response_variable: vision_result
  - action: input_select.select_option
    target:
      entity_id: input_select.office_ai_last_answer
    data:
      option: checking
  - action: input_text.set_value
    target:
      entity_id: input_text.office_ai_last_source
    data:
      value: "{{ (source | default('manual'))[:100] }}"
  - action: camera.snapshot
    continue_on_error: true
    target:
      entity_id: camera.office_camera
    data:
      filename: /media/office_debug/last.jpg
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Office presence check
      entity_id: ai_task.anthropic_claude_haiku_5_5
      instructions: This is a snapshot from a fixed camera in a home office. It may
        be a night-vision image. Is at least one real person physically present in
        the room right now? Count someone sitting still or partly visible. Do not
        count people shown on screens, posters, or photos. Do not describe or identify
        anyone. In reason, say in under 15 words what supports your answer.
      structure:
        person_present:
          description: True if a real person is in the room
          required: true
          selector:
            boolean: {}
        reason:
          description: Under 15 words
          required: true
          selector:
            text: {}
      attachments:
      - media_content_id: media-source://camera/camera.office_camera
        media_content_type: image/jpeg
    response_variable: result
  - if:
    - condition: template
      value_template: '{{ result is not defined or result.data is not defined or result.data.person_present is not defined }}'
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.office_ai_last_answer
      data:
        option: error
    - action: input_text.set_value
      target:
        entity_id: input_text.office_ai_last_reason
      data:
        value: The AI call failed or returned no answer. Check the Home Assistant log.
    - action: counter.increment
      target:
        entity_id: counter.office_ai_checks_error
    - stop: AI call failed
      error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.office_ai_last_reason
    data:
      value: '{{ (result.data.reason | string)[:250] }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.office_ai_last_answer
    data:
      option: "{{ 'person' if result.data.person_present else 'empty' }}"
  - action: counter.increment
    target:
      entity_id: "{{ 'counter.office_ai_checks_person' if result.data.person_present else 'counter.office_ai_checks_empty' }}"
  - variables:
      out:
        person_present: '{{ result.data.person_present }}'
        reason: '{{ result.data.reason }}'
  - stop: Done
    response_variable: out
office_vision_check:
  alias: Office vision check
  description: Snapshot, classify through office_vision.py, record the result. person_present is null on any failure.
  icon: mdi:eye-check-outline
  mode: parallel
  fields:
    source:
      description: What asked for this check (shown on the dashboard).
      example: 30-second check
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.office_ai_last_answer
    data:
      option: checking
  - action: input_text.set_value
    target:
      entity_id: input_text.office_ai_last_source
    data:
      value: "{{ (source | default('manual'))[:100] }}"
  - action: camera.snapshot
    continue_on_error: true
    target:
      entity_id: camera.office_camera
    data:
      filename: /media/office_debug/last.jpg
  - action: shell_command.office_vision_classify
    continue_on_error: true
    data:
      source: "{{ (source | default('manual')) | replace(\"'\", '') }}"
    response_variable: shell
  - variables:
      vision: "{{ (shell.stdout if shell is defined and shell.stdout is defined else '') | from_json(default={}) }}"
      status: "{{ vision.get('status', 'internal_error') }}"
      present: "{{ vision.get('person_present') }}"
      failed: "{{ vision.get('person_present') not in [true, false] }}"
  - action: input_text.set_value
    target:
      entity_id: input_text.office_ai_last_reason
    data:
      value: "{{ (vision.get('summary', 'The classifier returned nothing. Check the Home Assistant log.') | string)[:250] }}"
  - action: input_select.select_option
    target:
      entity_id: input_select.office_ai_last_answer
    data:
      option: "{{ 'error' if failed else ('person' if present else 'empty') }}"
  - if:
    - condition: template
      value_template: "{{ status not in ['backoff', 'busy', 'budget_exhausted', 'reused'] }}"
    then:
    - action: counter.increment
      target:
        entity_id: "{{ 'counter.office_ai_checks_error' if failed else ('counter.office_ai_checks_person' if present else 'counter.office_ai_checks_empty') }}"
  - action: homeassistant.update_entity
    continue_on_error: true
    target:
      entity_id: sensor.office_vision_cost
  - variables:
      out:
        person_present: "{{ vision.get('person_present') }}"
        status: "{{ status }}"
        reused: "{{ vision.get('reused', false) }}"
        summary: "{{ vision.get('summary', '') }}"
  - stop: Done
    response_variable: out
doorbell_describe_visitor:
  alias: Doorbell describe visitor
  description: Grabs a doorbell frame and asks the AI who or what is at the door. Returns description, or nothing if the frame or AI call fails.
  icon: mdi:doorbell-video
  mode: single
  sequence:
  - variables:
      empty:
        description: ""
  - action: shell_command.doorbell_frame
    data:
      name: ring
    response_variable: frame
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ frame is not defined or frame.returncode != 0 }}"
    then:
    - stop: No doorbell frame
      response_variable: empty
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Doorbell visitor
      entity_id: ai_task.anthropic_claude_haiku_5_5
      instructions: This snapshot is from a front-door doorbell camera, taken seconds
        after the bell rang. It may be an infrared night image. In under 10 words,
        say who or what is at the door, for example "delivery driver with a package"
        or "two people waiting". Describe, do not identify anyone. If nobody is visible,
        say so.
      structure:
        description:
          description: Under 10 words
          required: true
          selector:
            text: {}
      attachments:
      - media_content_id: media-source://media_source/local/doorbell/ring.jpg
        media_content_type: image/jpeg
    response_variable: ai
  - variables:
      out:
        description: "{{ ai.data.description if ai is defined and ai.data is defined else '' }}"
  - stop: Done
    response_variable: out
