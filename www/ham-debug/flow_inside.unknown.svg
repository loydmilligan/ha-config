<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#4da3ff'/></marker></defs><rect width='1000' height='600' rx='18' fill='#1c2330'/><text x='30' y='42' fill='#8a96a8' font-size='18' font-weight='700'>OCCUPANCY → HUE BULB</text><text x='30' y='332' fill='#8a96a8' font-size='18' font-weight='700'>HUMIDITY → EXHAUST FAN (SWITCHBOT)</text><line x1='30' y1='300' x2='970' y2='300' stroke='#334055' stroke-width='2'/><line x1='240.0' y1='135' x2='390.0' y2='135' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='315.0' y='107' text-anchor='middle' fill='#e6ebf2' font-size='14'>motion</text><text x='315.0' y='125' text-anchor='middle' fill='#e6ebf2' font-size='14'>or shower</text><line x1='390.0' y1='185' x2='240.0' y2='185' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='315.0' y='205' text-anchor='middle' fill='#e6ebf2' font-size='14'>no motion</text><text x='315.0' y='223' text-anchor='middle' fill='#e6ebf2' font-size='14'>for 2 min</text><line x1='610.0' y1='135' x2='760.0' y2='135' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='685.0' y='107' text-anchor='middle' fill='#e6ebf2' font-size='14'>door shut 45 s</text><text x='685.0' y='125' text-anchor='middle' fill='#e6ebf2' font-size='14'>+ motion</text><line x1='760.0' y1='185' x2='610.0' y2='185' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='685.0' y='205' text-anchor='middle' fill='#e6ebf2' font-size='14'>door</text><text x='685.0' y='223' text-anchor='middle' fill='#e6ebf2' font-size='14'>opens</text><text x='500' y='280' text-anchor='middle' fill='#8a96a8' font-size='15'>bulb on at house light level when occupied · off 1 min after vacant</text><line x1='240.0' y1='420' x2='390.0' y2='420' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='315.0' y='392' text-anchor='middle' fill='#e6ebf2' font-size='14'>humidity ≥</text><text x='315.0' y='410' text-anchor='middle' fill='#e6ebf2' font-size='14'>baseline + 8</text><line x1='610.0' y1='420' x2='760.0' y2='420' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='685.0' y='392' text-anchor='middle' fill='#e6ebf2' font-size='14'>humidity ≤</text><text x='685.0' y='410' text-anchor='middle' fill='#e6ebf2' font-size='14'>baseline + 3</text><line x1='760.0' y1='470' x2='610.0' y2='470' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='685.0' y='490' text-anchor='middle' fill='#e6ebf2' font-size='14'>humidity</text><text x='685.0' y='508' text-anchor='middle' fill='#e6ebf2' font-size='14'>up again</text><path d='M870 500.0 C 870 590, 130 590, 130 508.0' fill='none' stroke='#4da3ff' stroke-width='3' marker-end='url(#a)'/><text x='500' y='578' text-anchor='middle' fill='#e6ebf2' font-size='15'>room vacant 10 min (or safety: on 90 min and vacant) → fan off</text><rect x='20.0' y='105.0' width='220' height='110' rx='16' fill='#273142' stroke='#56637a' stroke-width='2'/><text x='130' y='146' text-anchor='middle' fill='#e6ebf2' font-size='22' font-weight='700'>VACANT</text><text x='130' y='174' text-anchor='middle' fill='#8a96a8' font-size='16'>nobody here</text><text x='130' y='196' text-anchor='middle' fill='#8a96a8' font-size='16'>light off</text><rect x='390.0' y='105.0' width='220' height='110' rx='16' fill='#273142' stroke='#56637a' stroke-width='2'/><text x='500' y='146' text-anchor='middle' fill='#e6ebf2' font-size='22' font-weight='700'>OCCUPIED</text><text x='500' y='174' text-anchor='middle' fill='#8a96a8' font-size='16'>door open</text><text x='500' y='196' text-anchor='middle' fill='#8a96a8' font-size='16'>follows motion</text><rect x='760.0' y='105.0' width='220' height='110' rx='16' fill='#173a2a' stroke='#4cd964' stroke-width='5'/><text x='870' y='146' text-anchor='middle' fill='#e6ebf2' font-size='22' font-weight='700'>SOMEONE INSIDE</text><text x='870' y='174' text-anchor='middle' fill='#8a96a8' font-size='16'>door closed</text><text x='870' y='196' text-anchor='middle' fill='#8a96a8' font-size='16'>stays on, even if still</text><text x='870' y='95.0' text-anchor='middle' fill='#4cd964' font-size='16' font-weight='700'>● NOW</text><rect x='20.0' y='390.0' width='220' height='110' rx='16' fill='#273142' stroke='#56637a' stroke-width='2'/><text x='130' y='431' text-anchor='middle' fill='#e6ebf2' font-size='22' font-weight='700'>FAN OFF</text><text x='130' y='459' text-anchor='middle' fill='#8a96a8' font-size='16'>normal humidity</text><rect x='390.0' y='390.0' width='220' height='110' rx='16' fill='#273142' stroke='#56637a' stroke-width='2'/><text x='500' y='431' text-anchor='middle' fill='#e6ebf2' font-size='22' font-weight='700'>SHOWER</text><text x='500' y='459' text-anchor='middle' fill='#8a96a8' font-size='16'>fan running</text><rect x='760.0' y='390.0' width='220' height='110' rx='16' fill='#273142' stroke='#56637a' stroke-width='2'/><text x='870' y='431' text-anchor='middle' fill='#e6ebf2' font-size='22' font-weight='700'>FAN ON</text><text x='870' y='459' text-anchor='middle' fill='#8a96a8' font-size='16'>no shower: clearing</text><text x='870' y='481' text-anchor='middle' fill='#8a96a8' font-size='16'>or turned on by hand</text></svg>