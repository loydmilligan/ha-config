# Front door arrival (ha-manager, 2026-11-18). Matt approved the staged plan; stage 2 (ask-first) approved
# 2026-11-18 17:37. What may happen is set by input_select.door_unlock_stage (watch_only / ask_first /
# hands_free) and the kill switch input_boolean.door_auto_unlock_enabled. The stage-1 loggers below
# never lock or unlock anything. It logs what each signal says on every arrival so the
# later stages (2 ask-first, 3 hands-free) can be judged on real data.
#
# Signals (per person):
#   proximity  sensor.home_<person>_distance (ft) + _direction_of_travel  -> "approaching" arms a
#              get-ready state (binary_sensor.<name>_arrival_armed); it never unlocks on its own
#   Wi-Fi      companion-app Wi-Fi connection sensor; home SSIDs live in input_text.home_wifi_ssids
#              (set once by service call, kept out of this public repo). Confirmation, not trigger.
#   BLE        companion-app BLE transmitter -> iBeacon Tracker via the LED Matrix proxy by the door
#              (estimated distance entity is filled in below once iBeacon has seen the phone)
#   door       binary_sensor.front_door_door (August DoorSense), lock.front_door
# Safety rails for later stages (logged now): away >= 10 min, came from beyond ~1 km, re-lock if the
# door isn't opened within ~2 min of an unlock, log every unlock and near-miss.
#
# Modes: input_boolean.door_secure_mode off = hands-free, on = secure (tap to unlock). It turns
# on by itself after 4 h away and back off once home and unlocked (only if it was set automatically).
#
# Adding Mara later: add her phone to the Proximity "Home" entry (Settings > Proximity > options),
# copy the trip-max sensor and armed binary_sensor blocks below, and add one entry to `people` in both automations.

input_boolean:
  # Secure mode: presence checks still run, but nothing unlocks until Matt taps Unlock on the
  # phone/watch notification. Off = hands-free (unlock once all checks pass, then auto-relock).
  door_secure_mode:
    name: Front door secure mode
    icon: mdi:shield-lock
  # Master kill switch: off = nothing ever unlocks automatically or from a notification.
  door_auto_unlock_enabled:
    name: Front door auto-unlock enabled
    icon: mdi:lock-open-alert
  # Internal: the short-walk path already asked during this absence from home Wi-Fi.
  door_short_walk_prompted:
    name: Front door short-walk prompt sent (internal)
    icon: mdi:walk
  # Watch-only trip: the watch's beacon has been gone from home 10+ min while the phone stayed home.
  matt_watch_only_away:
    name: Matt out with only the watch
    icon: mdi:watch-variant
  # Internal: secure mode was switched on automatically (away > 4 h), so it may switch itself off.
  door_secure_by_auto:
    name: Front door secure mode set automatically
    icon: mdi:shield-sync

input_number:
  # iBeacon distance (m) that counts as "at the door" via the LED Matrix proxy. Tune from the logs.
  door_ble_near_m:
    name: Front door BLE near distance
    min: 0.5
    max: 15
    step: 0.5
    unit_of_measurement: m
    mode: box
    icon: mdi:bluetooth

input_select:
  # What the arrival logic is allowed to do. watch_only = log only (stage 1); ask_first = send the
  # "Unlock front door?" notification, unlock only on a tap (stage 2); hands_free = unlock by itself
  # unless secure mode is on, in which case it still asks (stage 3). Matt approved stage 2 2026-11-18.
  door_unlock_stage:
    name: Front door unlock stage
    icon: mdi:stairs
    options: [watch_only, ask_first, hands_free]

input_text:
  # One-time token for the pending "Unlock front door?" notification: "<token>|<expiry epoch>".
  door_unlock_token:
    name: Front door unlock token (internal)
    max: 100
  home_wifi_ssids:
    name: Home Wi-Fi SSIDs (comma-separated)
    max: 255
    icon: mdi:wifi-lock

template:
  # Farthest Matt got from home on the current trip (m); resets when he leaves home.
  - triggers:
      - trigger: state
        entity_id: sensor.home_matt_mariani_distance
      - trigger: state
        entity_id: person.matt_mariani
        from: home
        id: left
    sensor:
      - name: Matt trip max distance
        unique_id: matt_trip_max_distance
        unit_of_measurement: m
        icon: mdi:map-marker-distance
        state: >-
          {% set d = states('sensor.home_matt_mariani_distance') | float(0) * 0.3048 %}
          {% if trigger.id == 'left' %}{{ d | round(0) }}
          {% else %}{{ [this.state | float(0), d] | max | round(0) }}{% endif %}
  # Matt's phone as heard over BLE (companion-app BLE transmitter -> iBeacon Tracker). The phone
  # rotates its Bluetooth address, so iBeacon makes one entity per address: take every live
  # estimated-distance sensor with Matt's beacon UUID. State = closest reading heard by the LED Matrix
  # proxy at the front door (24:DC:C3:C4:CE:36); attributes keep the closest reading from any scanner.
  - sensor:
      - name: Matt phone door BLE distance
        unique_id: matt_phone_door_ble_distance
        unit_of_measurement: m
        icon: mdi:bluetooth-connect
        state: >-
          {% set uuid = '4e6c3c7a-418d-4314-bdba-40866c93d79c' %}
          {% set door = '24:DC:C3:C4:CE:36' %}
          {% set ns = namespace(d=[]) %}
          {% for s in states.sensor if s.entity_id.endswith('_estimated_distance')
               and s.attributes.get('uuid') == uuid and s.attributes.get('source') == door and s.state | is_number %}
            {% set ns.d = ns.d + [s.state | float * 0.3048] %}
          {% endfor %}
          {# 99 = the door proxy does not hear the phone right now #}
          {{ (ns.d | min) | round(1) if ns.d else 99 }}
        attributes:
          nearest_any_m: >-
            {% set uuid = '4e6c3c7a-418d-4314-bdba-40866c93d79c' %}
            {% set ns = namespace(d=[]) %}
            {% for s in states.sensor if s.entity_id.endswith('_estimated_distance')
                 and s.attributes.get('uuid') == uuid and s.state | is_number %}
              {% set ns.d = ns.d + [s.state | float * 0.3048] %}
            {% endfor %}
            {{ (ns.d | min) | round(1) if ns.d else none }}
          nearest_any_source: >-
            {% set uuid = '4e6c3c7a-418d-4314-bdba-40866c93d79c' %}
            {% set ns = namespace(best=99999, src=none) %}
            {% for s in states.sensor if s.entity_id.endswith('_estimated_distance')
                 and s.attributes.get('uuid') == uuid and s.state | is_number %}
              {% if s.state | float < ns.best %}{% set ns.best = s.state | float %}{% set ns.src = s.attributes.get('source') %}{% endif %}
            {% endfor %}
            {{ {'24:DC:C3:C4:CE:36': 'led-matrix (door)', 'C0:FB:F9:61:B1:E3': 'CM4 dongle',
                'E0:5A:1B:6C:3C:46': 'sensorguy', 'EC:C9:FF:CA:DB:3E': 'office presence'}.get(ns.src, ns.src) }}
      # Same for Matt's Pixel Watch beacon (UUID 7e4c9895-…1b46); it rotates its address too.
      - name: Matt watch door BLE distance
        unique_id: matt_watch_door_ble_distance
        unit_of_measurement: m
        icon: mdi:watch-variant
        state: >-
          {% set uuid = '7e4c9895-042f-46c2-94a1-66bf0f0d1b46' %}
          {% set door = '24:DC:C3:C4:CE:36' %}
          {% set ns = namespace(d=[]) %}
          {% for s in states.sensor if s.entity_id.endswith('_estimated_distance')
               and s.attributes.get('uuid') == uuid and s.attributes.get('source') == door and s.state | is_number %}
            {% set ns.d = ns.d + [s.state | float * 0.3048] %}
          {% endfor %}
          {# 99 = the door proxy does not hear the watch right now #}
          {{ (ns.d | min) | round(1) if ns.d else 99 }}
  - binary_sensor:
      # Any home Bluetooth proxy currently hears Matt's watch beacon (across its rotating addresses).
      - name: Matt watch beacon heard
        unique_id: matt_watch_beacon_heard
        icon: mdi:watch-variant
        state: >-
          {% set uuid = '7e4c9895-042f-46c2-94a1-66bf0f0d1b46' %}
          {{ states.sensor | selectattr('entity_id', 'search', '_estimated_distance$')
             | selectattr('attributes.uuid', 'defined') | selectattr('attributes.uuid', 'eq', uuid)
             | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count > 0 }}
      # Matt is approaching home: away >= 10 min, proximity says "towards", within ~2 km.
      # On only after 2 min of that (delay_on); stays on 3 min after it stops (covers the moment of arrival).
      - name: Matt arrival armed
        unique_id: matt_arrival_armed
        icon: mdi:home-import-outline
        delay_on: "00:02:00"
        delay_off: "00:03:00"
        state: >-
          {% set p = states.person.matt_mariani %}
          {% set d_m = states('sensor.home_matt_mariani_distance') | float(-1) * 0.3048 %}
          {{ p is not none and p.state != 'home'
             and (now() - p.last_changed).total_seconds() >= 600
             and is_state('sensor.home_matt_mariani_direction_of_travel', 'towards')
             and 0 <= d_m <= 2000 }}
        attributes:
          distance_m: "{{ (states('sensor.home_matt_mariani_distance') | float(0) * 0.3048) | round(0) }}"
      # All presence checks for Matt: approaching (armed: away >= 10 min, towards, < 2 km) AND
      # a confirmation: phone on a home Wi-Fi SSID, or iBeacon says it's within door_ble_near_m.
      - name: Matt door checks pass
        unique_id: matt_door_checks_pass
        icon: mdi:shield-check
        state: >-
          {% set ssids = states('input_text.home_wifi_ssids').split(',') | map('trim') | reject('eq', '') | list %}
          {% set ble = 'sensor.matt_phone_door_ble_distance' %}
          {% set wifi_ok = states('sensor.pixel_11_pro_wi_fi_connection') in ssids %}
          {% set ble_ok = ble != '' and states(ble) | float(99) <= states('input_number.door_ble_near_m') | float(3) %}
          {{ is_state('binary_sensor.matt_arrival_armed', 'on') and (wifi_ok or ble_ok) }}
        attributes:
          confirmed_by: >-
            {% set ssids = states('input_text.home_wifi_ssids').split(',') | map('trim') | reject('eq', '') | list %}
            {{ 'wifi' if states('sensor.pixel_11_pro_wi_fi_connection') in ssids else 'ble' }}

script:
  # Unlock for an arrival, then re-lock if DoorSense doesn't see the door open within 2 min.
  # Yale's own 4-min auto-lock stays on as a backstop.
  door_arrival_unlock:
    alias: Front door — arrival unlock with 2-min re-lock
    mode: single
    max_exceeded: silent
    fields:
      how: { description: "tap or hands_free" }
      who: { description: "person name for the log" }
    sequence:
      - condition: state
        entity_id: input_boolean.door_auto_unlock_enabled
        state: "on"
      - condition: state
        entity_id: lock.front_door
        state: locked
      - action: lock.unlock
        target: { entity_id: lock.front_door }
      - event: ham_door_arrival
        event_data: { phase: unlocked, how: "{{ how }}", person: "{{ who }}",
                      mode: "{{ 'secure' if is_state('input_boolean.door_secure_mode', 'on') else 'hands-free' }}",
                      stage: "{{ states('input_select.door_unlock_stage') }}" }
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: >-
            UNLOCKED for {{ who }} ({{ 'tapped Unlock' if how == 'tap' else 'hands-free' }};
            stage {{ states('input_select.door_unlock_stage') }},
            mode {{ 'secure' if is_state('input_boolean.door_secure_mode', 'on') else 'hands-free' }})
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.front_door_door
            to: "on"
        timeout: "00:02:00"
        continue_on_timeout: true
      - if: "{{ wait.trigger is none }}"
        then:
          - action: lock.lock
            target: { entity_id: lock.front_door }
          - action: notify.mobile_app_pixel_11_pro
            data:
              title: Front door
              message: Re-locked — the door wasn't opened within 2 minutes of unlocking.
              data: { tag: front_door_relock, channel: Front door, importance: high }
          - action: logbook.log
            data:
              name: Front door arrival
              entity_id: lock.front_door
              message: RE-LOCKED — door not opened within 2 min of the arrival unlock
        else:
          - action: logbook.log
            data:
              name: Front door arrival
              entity_id: lock.front_door
              message: Door opened after the arrival unlock; Yale auto-lock (4 min) takes over

  # Sends the actionable notification. test=true sends a TEST token that is logged but never unlocks.
  door_ask_unlock:
    alias: Front door — ask "Unlock front door?"
    mode: single
    fields:
      who: { description: person name }
      notify_watch: { description: "also send straight to the watch (watch-only trip)" }
      test: { description: "true = test notification; a tap is logged but never unlocks" }
    sequence:
      - variables:
          is_test: "{{ test | default(false) | bool }}"
          token: "{{ ('TEST_' if is_test else '') ~ 'UNLOCK_FRONT_DOOR_' ~ (now().timestamp() * 1000) | int ~ '_' ~ (range(1000, 9999) | random) }}"
          expires: "{{ (now().timestamp() + 300) | int }}"
      - action: input_text.set_value
        target: { entity_id: input_text.door_unlock_token }
        data: { value: "{{ token }}|{{ expires }}" }
      - action: notify.mobile_app_pixel_11_pro
        data:
          title: "{{ 'TEST — ' if is_test else '' }}Front door"
          message: "{{ 'Test only, tapping will NOT unlock. ' if is_test else '' }}Welcome home{{ ', ' ~ who if who else '' }}. Unlock the front door?"
          data:
            tag: front_door_unlock
            channel: Front door
            importance: high
            priority: high
            ttl: 0
            timeout: 300
            actions:
              - action: "{{ token }}"
                title: Unlock
      - if: "{{ notify_watch | default(false) | bool }}"
        then:
          - action: notify.mobile_app_matt_s_watch
            continue_on_error: true
            data:
              title: "{{ 'TEST — ' if is_test else '' }}Front door"
              message: "{{ 'Test only. ' if is_test else '' }}Unlock the front door?"
              data:
                tag: front_door_unlock
                actions:
                  - action: "{{ token }}"
                    title: Unlock
      - event: ham_door_arrival
        event_data: { phase: asked, person: "{{ who }}", test: "{{ is_test }}", watch: "{{ notify_watch | default(false) }}" }
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: "{{ 'TEST ' if is_test else '' }}Asked {{ who }}: Unlock front door? (valid 5 min)"

automation:
  - id: door_arrival_watch
    alias: "[Front door] Arrival watch (stage 1, log only)"
    description: Logs each arrival with what every signal said. Never locks or unlocks.
    mode: parallel
    max: 6
    triggers:
      - trigger: state
        entity_id: [person.matt_mariani]
        to: home
        id: arrival
    variables:
      people:
        person.matt_mariani:
          name: Matt
          armed: binary_sensor.matt_arrival_armed
          trip_max: sensor.matt_trip_max_distance
          wifi: sensor.pixel_11_pro_wi_fi_connection
          ble_distance: sensor.matt_phone_door_ble_distance
      who: "{{ people[trigger.entity_id] }}"
      t0: "{{ now().isoformat() }}"
      away_min: >-
        {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(1)
           if trigger.from_state is not none else -1 }}
      came_from_m: "{{ states(who.trip_max) | float(-1) }}"
      was_armed: "{{ is_state(who.armed, 'on') }}"
      armed_for_min: >-
        {% set a = states[who.armed] %}
        {{ ((now() - a.last_changed).total_seconds() / 60) | round(1) if a is not none and a.state == 'on' else 0 }}
      ssids: "{{ states('input_text.home_wifi_ssids').split(',') | map('trim') | reject('eq', '') | list }}"
    actions:
      - variables:
          mode: "{{ 'secure' if is_state('input_boolean.door_secure_mode', 'on') else 'hands-free' }}"
          wifi_at_arrival: "{{ states(who.wifi) }}"
          lock_at_arrival: "{{ states('lock.front_door') }}"
      - event: ham_door_arrival
        event_data:
          phase: arrived
          person: "{{ trigger.entity_id }}"
          away_min: "{{ away_min }}"
          armed: "{{ was_armed }}"
          armed_for_min: "{{ armed_for_min }}"
          came_from_m: "{{ came_from_m }}"
          wifi: "{{ wifi_at_arrival }}"
          lock: "{{ lock_at_arrival }}"
          mode: "{{ mode }}"
      # Wait for the door to open (the real "I'm at the door" moment), up to 10 min.
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.front_door_door
            to: "on"
        timeout: "00:10:00"
        continue_on_timeout: true
      - variables:
          door_lag_s: >-
            {{ ((now() - as_datetime(t0)).total_seconds()) | round(0) if wait.trigger is not none else -1 }}
          wifi_state: "{{ states(who.wifi) }}"
          wifi_home: "{{ states(who.wifi) in ssids }}"
          wifi_lag_s: >-
            {% set w = states[who.wifi] %}
            {{ ((w.last_changed - as_datetime(t0)).total_seconds()) | round(0)
               if w is not none and w.state in ssids else 'n/a' }}
          ble_m: "{{ states(who.ble_distance) if who.ble_distance else 'n/a' }}"
          ble_any: >-
            {{ state_attr(who.ble_distance, 'nearest_any_m') }} m via {{ state_attr(who.ble_distance, 'nearest_any_source') }}
          rails_ok: "{{ away_min | float(0) >= 10 and came_from_m | float(0) >= 1000 }}"
      - event: ham_door_arrival
        event_data:
          phase: summary
          person: "{{ trigger.entity_id }}"
          away_min: "{{ away_min }}"
          armed: "{{ was_armed }}"
          came_from_m: "{{ came_from_m }}"
          door_lag_s: "{{ door_lag_s }}"
          wifi: "{{ wifi_state }}"
          wifi_home: "{{ wifi_home }}"
          wifi_lag_s: "{{ wifi_lag_s }}"
          ble_m: "{{ ble_m }}"
          ble_any: "{{ ble_any }}"
          rails_ok: "{{ rails_ok }}"
          mode: "{{ mode }}"
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: >-
            [{{ mode }}] {{ who.name }} arrived: away {{ away_min }} min, armed {{ 'yes (' ~ armed_for_min ~ ' min)' if was_armed else 'NO' }},
            from {{ came_from_m }} m; door opened {{ door_lag_s ~ ' s' if door_lag_s != -1 else 'not within 10 min' }};
            Wi-Fi {{ 'home' if wifi_home else wifi_state }} (lag {{ wifi_lag_s }} s); BLE at door {{ ble_m }} m (nearest {{ ble_any }});
            lock was {{ lock_at_arrival }}; stage-3 rails {{ 'PASS' if rails_ok else 'fail' }}

  - id: door_arrival_near_miss
    alias: "[Front door] Armed but no arrival (stage 1, log only)"
    mode: queued
    triggers:
      - trigger: state
        entity_id: [binary_sensor.matt_arrival_armed]
        from: "on"
        to: "off"
    variables:
      people:
        binary_sensor.matt_arrival_armed: { name: Matt, person: person.matt_mariani }
      who: "{{ people[trigger.entity_id] }}"
    conditions:
      - "{{ not is_state(who.person, 'home') }}"
    actions:
      - event: ham_door_arrival
        event_data:
          phase: near_miss
          person: "{{ who.person }}"
          armed_min: "{{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(1) }}"
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: >-
            Near-miss: {{ who.name }} was armed for
            {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(1) }} min but did not arrive
            (now {{ states(who.person) }})

  # ── Modes (stage 1: log what each mode WOULD do; no unlock, no notification yet) ──
  - id: door_would_unlock
    alias: "[Front door] Checks pass → log what the active mode would do (stage 1)"
    mode: queued
    triggers:
      - trigger: state
        entity_id: [binary_sensor.matt_door_checks_pass]
        from: "off"
        to: "on"
    variables:
      people:
        binary_sensor.matt_door_checks_pass: { name: Matt, person: person.matt_mariani }
      who: "{{ people[trigger.entity_id] }}"
      mode: "{{ 'secure' if is_state('input_boolean.door_secure_mode', 'on') else 'hands-free' }}"
      by: "{{ state_attr(trigger.entity_id, 'confirmed_by') }}"
    actions:
      - event: ham_door_arrival
        event_data:
          phase: would_unlock
          person: "{{ who.person }}"
          mode: "{{ mode }}"
          confirmed_by: "{{ by }}"
          lock: "{{ states('lock.front_door') }}"
          door: "{{ states('binary_sensor.front_door_door') }}"
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: >-
            [{{ mode }}] checks passed for {{ who.name }} (confirmed by {{ by }}):
            {{ 'WOULD UNLOCK now, then re-lock if the door is not opened within 2 min' if mode == 'hands-free'
               else 'WOULD SEND the Unlock notification (no tap, no unlock)' }}; lock is {{ states('lock.front_door') }}

  - id: door_secure_auto
    alias: "[Front door] Secure mode on after 4 h away; off again once home and unlocked"
    mode: queued
    triggers:
      - trigger: state
        entity_id: person.matt_mariani
        from: home
        for: "04:00:00"
        id: long_away
      - trigger: state
        entity_id: lock.front_door
        to: unlocked
        id: unlocked
    actions:
      - choose:
          - conditions:
              - "{{ trigger.id == 'long_away' and is_state('input_boolean.door_secure_mode', 'off') }}"
              - "{{ not is_state('person.matt_mariani', 'home') }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: [input_boolean.door_secure_mode, input_boolean.door_secure_by_auto] }
              - action: logbook.log
                data:
                  name: Front door arrival
                  entity_id: input_boolean.door_secure_mode
                  message: Secure mode switched ON automatically (away more than 4 h)
          # Only undo what the automation did; a secure mode Matt set by hand stays on.
          - conditions:
              - "{{ trigger.id == 'unlocked' }}"
              - "{{ is_state('person.matt_mariani', 'home') }}"
              - "{{ is_state('input_boolean.door_secure_by_auto', 'on') }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: [input_boolean.door_secure_mode, input_boolean.door_secure_by_auto] }
              - action: logbook.log
                data:
                  name: Front door arrival
                  entity_id: input_boolean.door_secure_mode
                  message: Secure mode switched OFF automatically (home and door unlocked)

  - id: door_secure_manual
    alias: "[Front door] Manual secure-mode change clears the auto flag"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.door_secure_mode
    conditions:
      - "{{ trigger.to_state.context.user_id is not none }}"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.door_secure_by_auto }
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: input_boolean.door_secure_mode
          message: "Secure mode set {{ trigger.to_state.state | upper }} by hand"

  # Log every lock change with the mode active at the time (who/what did it comes from the lock).
  - id: door_lock_log
    alias: "[Front door] Log every lock/unlock with the active mode"
    mode: queued
    triggers:
      - trigger: state
        entity_id: lock.front_door
        to: [locked, unlocked]
    actions:
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: >-
            [{{ 'secure' if is_state('input_boolean.door_secure_mode', 'on') else 'hands-free' }}]
            lock {{ trigger.to_state.state }} (by {{ state_attr('lock.front_door', 'changed_by') or 'unknown' }});
            Matt {{ states('person.matt_mariani') }}

  # ── Stage 2/3: act when the checks pass ──
  - id: door_arrival_act
    alias: "[Front door] Checks pass → ask (stage 2) or unlock (stage 3, hands-free mode)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: [binary_sensor.matt_door_checks_pass]
        from: "off"
        to: "on"
    variables:
      people:
        binary_sensor.matt_door_checks_pass: { name: Matt, person: person.matt_mariani }
      who: "{{ people[trigger.entity_id] }}"
      stage: "{{ states('input_select.door_unlock_stage') }}"
    conditions:
      - condition: state
        entity_id: input_boolean.door_auto_unlock_enabled
        state: "on"
      - "{{ stage in ['ask_first', 'hands_free'] }}"
      - condition: state
        entity_id: lock.front_door
        state: locked
      - condition: state
        entity_id: binary_sensor.front_door_door
        state: "off"
    actions:
      - if: "{{ stage == 'hands_free' and is_state('input_boolean.door_secure_mode', 'off') }}"
        then:
          - action: script.turn_on
            target: { entity_id: script.door_arrival_unlock }
            data: { variables: { how: hands_free, who: "{{ who.name }}" } }
          - action: notify.mobile_app_pixel_11_pro
            data:
              title: Front door
              message: Unlocked for you. It re-locks in 2 minutes if the door isn't opened.
              data: { tag: front_door_unlock, channel: Front door, importance: high }
        else:
          - action: script.door_ask_unlock
            data: { who: "{{ who.name }}" }

  # A tap on the notification. Only the current, unexpired token works, and only once.
  - id: door_unlock_tap
    alias: "[Front door] Unlock tapped on the notification"
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    variables:
      action_id: "{{ trigger.event.data.action | default('') }}"
      stored: "{{ states('input_text.door_unlock_token').split('|') }}"
      allowed: !secret door_tap_webhooks
      from_matt: "{{ (trigger.event.data.webhook_id | default('')) in allowed.split(',') }}"
      valid: >-
        {{ from_matt and stored | count == 2 and action_id == stored[0] and now().timestamp() <= stored[1] | int(0) }}
    conditions:
      - "{{ 'UNLOCK_FRONT_DOOR_' in action_id }}"
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.door_unlock_token }
        data: { value: "used" }
      - choose:
          - conditions: "{{ not valid }}"
            sequence:
              - action: logbook.log
                data:
                  name: Front door arrival
                  entity_id: lock.front_door
                  message: "Unlock tap IGNORED ({{ 'not from Matt''s phone or watch' if not from_matt else 'old or unknown notification' }})"
          - conditions: "{{ action_id.startswith('TEST_') }}"
            sequence:
              - action: logbook.log
                data:
                  name: Front door arrival
                  entity_id: lock.front_door
                  message: TEST tap received from the notification — would have unlocked (nothing changed)
              - action: notify.mobile_app_pixel_11_pro
                data:
                  title: Front door
                  message: Test tap received. Nothing was unlocked.
                  data: { tag: front_door_unlock }
        default:
          - action: notify.mobile_app_pixel_11_pro
            data: { message: clear_notification, data: { tag: front_door_unlock } }
          - action: script.turn_on
            target: { entity_id: script.door_arrival_unlock }
            data: { variables: { how: tap, who: Matt } }

  # Log a notification that was never tapped.
  - id: door_ask_expired
    alias: "[Front door] Unlock notification expired without a tap"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_text.door_unlock_token
    conditions:
      - "{{ '|' in trigger.to_state.state and not trigger.to_state.state.startswith('TEST_') }}"
    actions:
      - delay: "00:05:05"
      - condition: "{{ states('input_text.door_unlock_token') == trigger.to_state.state }}"
      - action: input_text.set_value
        target: { entity_id: input_text.door_unlock_token }
        data: { value: "expired" }
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: Unlock notification expired after 5 min without a tap (no unlock)

  # ── Short-walk path (ask only, never hands-free) ──
  # Phone off home Wi-Fi for 1+ min, then the LED Matrix hears it at the door -> ask once per absence.
  - id: door_short_walk_ask
    alias: "[Front door] Short walk: off Wi-Fi 1+ min, heard at the door → ask"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.matt_phone_door_ble_distance
        below: input_number.door_ble_near_m
    variables:
      ssids: "{{ states('input_text.home_wifi_ssids').split(',') | map('trim') | reject('eq', '') | list }}"
      wifi: "{{ states.sensor.pixel_11_pro_wi_fi_connection }}"
    conditions:
      - condition: state
        entity_id: input_boolean.door_auto_unlock_enabled
        state: "on"
      - "{{ states('input_select.door_unlock_stage') in ['ask_first', 'hands_free'] }}"
      - "{{ wifi is not none and wifi.state not in ssids and (now() - wifi.last_changed).total_seconds() >= 60 }}"
      - condition: state
        entity_id: input_boolean.door_short_walk_prompted
        state: "off"
      - "{{ '|' not in states('input_text.door_unlock_token') or states('input_text.door_unlock_token').startswith('TEST_') }}"
      - condition: state
        entity_id: lock.front_door
        state: locked
      - condition: state
        entity_id: binary_sensor.front_door_door
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.door_short_walk_prompted }
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: >-
            Short walk: phone off Wi-Fi {{ ((now() - wifi.last_changed).total_seconds() / 60) | round(1) }} min,
            heard at the door {{ states('sensor.matt_phone_door_ble_distance') }} m → asking
      - action: script.door_ask_unlock
        data: { who: Matt }

  - id: door_short_walk_reset
    alias: "[Front door] Short walk: re-arm when the phone leaves home Wi-Fi"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.pixel_11_pro_wi_fi_connection
    conditions:
      - "{{ trigger.from_state is not none and trigger.from_state.state in states('input_text.home_wifi_ssids').split(',') | map('trim') | list
            and trigger.to_state.state not in states('input_text.home_wifi_ssids').split(',') | map('trim') | list }}"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.door_short_walk_prompted }

  # ── Watch-only trips (ask only, never hands-free) ──
  # Watch beacon gone from every home proxy for 10 min while the phone is still home -> out with only the watch.
  - id: door_watch_only_away
    alias: "[Front door] Watch-only trip detection"
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.matt_watch_beacon_heard
        to: "off"
        for: "00:10:00"
        id: gone
      - trigger: state
        entity_id: binary_sensor.matt_watch_beacon_heard
        to: "on"
        for: "00:05:00"
        id: back
    actions:
      - choose:
          - conditions:
              - "{{ trigger.id == 'gone' }}"
              - "{{ is_state('device_tracker.matt_phone_beacon', 'home')
                    or states('sensor.pixel_11_pro_wi_fi_connection') in states('input_text.home_wifi_ssids').split(',') | map('trim') | list }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.matt_watch_only_away }
              - action: logbook.log
                data:
                  name: Front door arrival
                  entity_id: input_boolean.matt_watch_only_away
                  message: Watch-only trip — watch beacon gone 10 min, phone still home
          # Watch back for 5 min without a door prompt (e.g. came in another way): clear quietly.
          - conditions: "{{ trigger.id == 'back' and is_state('input_boolean.matt_watch_only_away', 'on') }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.matt_watch_only_away }
              - action: logbook.log
                data:
                  name: Front door arrival
                  entity_id: input_boolean.matt_watch_only_away
                  message: Watch back home (no front-door prompt) — watch-only trip cleared

  - id: door_watch_only_ask
    alias: "[Front door] Watch-only trip: watch heard at the door → ask on watch + phone"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.matt_watch_door_ble_distance
        below: input_number.door_ble_near_m
    conditions:
      - condition: state
        entity_id: input_boolean.matt_watch_only_away
        state: "on"
      - condition: state
        entity_id: input_boolean.door_auto_unlock_enabled
        state: "on"
      - "{{ states('input_select.door_unlock_stage') in ['ask_first', 'hands_free'] }}"
      - condition: state
        entity_id: lock.front_door
        state: locked
      - condition: state
        entity_id: binary_sensor.front_door_door
        state: "off"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.matt_watch_only_away }
      - action: logbook.log
        data:
          name: Front door arrival
          entity_id: lock.front_door
          message: "Watch-only arrival: watch heard at the door {{ states('sensor.matt_watch_door_ble_distance') }} m → asking on watch + phone"
      - action: script.door_ask_unlock
        data: { who: Matt, notify_watch: true }
