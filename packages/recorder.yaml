# Recorder history exclusions (ha-manager, approved by Matt 2026-11-20).
#
# Roomba+ creates ~94 entities. Kept in history: vacuum state, battery, phase,
# error, readiness, connection, bin, mission active/result, maintenance due,
# switches, selects and all mission/stuck events.
# Excluded below: lifetime counters, 30-day rates, part counters, firmware,
# diagnostics and the map images. device_tracker.roomba is excluded because it
# reports position about once a second while cleaning (~5,000 rows per run);
# the live state still works and Roomba+ keeps its own path/coverage maps.
#
# Office radar and vision (weekly review 2026-11-22, approved by Matt): the
# Everything Presence Lite target_N_{x,y,speed,angle,distance,resolution} sensors
# were 82% of all history rows. The glob matches target_<digit>_<thing> only, so
# zone_N_target_count, illuminance, CO2 and every binary_sensor stay recorded.
# The office vision poll runs every ~10 s, so its automation and last-poll helper
# are excluded; their live states still work. Amcrest camera events (half of all
# event rows) aren't used by anything; motion is a binary_sensor and is kept.
# The Marsh desk plug (power/current, ~14% each after this) is left in on purpose
# until the power dashboard is designed.
# Rollback: delete this file, restart HA.

recorder:
  exclude:
    entity_globs:
      - sensor.everything_presence_lite_*_target_?_*
    event_types:
      - amcrest
    entities:
      - automation.office_vision_poll
      - input_datetime.office_vision_last_poll
      - device_tracker.roomba
      - image.roomba_map
      - image.roomba_coverage_map
      - image.roomba_rooms_map
      - calendar.roomba_schedule
      - todo.roomba_maintenance
