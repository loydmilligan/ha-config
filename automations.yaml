- id: 'pocket_sign_phone_battery_low'
  alias: Pocket Sign - phone battery low
  description: >-
    When Matt's phone is below the warning level and isn't charging, show a
    note on the Office TV sign (updated in place as it drops). Crossing below
    the level also takes over the Chromecast; later updates don't. Remove the
    note once the phone is charging or full. Warning level is 20%, or 90% while
    input_boolean.pocket_sign_battery_test is on (flipping it re-checks now).
    Needs Pocket Sign 0.5.0 (level/key).
  triggers:
  - trigger: state
    entity_id: sensor.pixel_11_pro_battery_level
    id: level
  - trigger: state
    entity_id: sensor.pixel_11_pro_battery_state
    to:
    - charging
    - full
    id: charging
  - trigger: state
    entity_id: input_boolean.pocket_sign_battery_test
    to:
    - 'on'
    - 'off'
    id: test
  conditions: []
  variables:
    threshold: "{{ 90 if is_state('input_boolean.pocket_sign_battery_test', 'on') else 20 }}"
    battery: "{{ states('sensor.pixel_11_pro_battery_level') | float(100) }}"
    on_battery: "{{ states('sensor.pixel_11_pro_battery_state') in ['discharging', 'not_charging'] }}"
    low: "{{ on_battery and battery < threshold }}"
    crossed: >-
      {{ (trigger.id == 'test' and trigger.to_state.state == 'on') or (trigger.id == 'level' and trigger.from_state is not none
         and (trigger.from_state.state | float(0)) >= threshold) }}
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'charging' or (trigger.id == 'test' and not low) }}"
      sequence:
      - action: rest_command.sign_clear
        data:
          display: 027YiRhj
          key: phone-battery
    - conditions:
      - condition: template
        value_template: "{{ low }}"
      sequence:
      - action: rest_command.sign_message
        data:
          display: 027YiRhj
          text: >-
            Matt's phone battery {{ states('sensor.pixel_11_pro_battery_level') }}%{{ ' (test)' if is_state('input_boolean.pocket_sign_battery_test', 'on') else '' }}
          duration: 0
          level: note
          key: phone-battery
          cast: "{{ crossed }}"
          theme: neon
          mode: bounce
          bounce: perfect
  mode: queued
- id: office_lights_ai
  alias: Office Lights by AI Camera
  description: 'Motion plus an AI snapshot check turns the lights on. While they are
    on, the AI rechecks every 5 minutes; two "no person" answers two minutes apart
    turn them off. Ignores motion for 20 seconds after the lights go off. If a person
    turned them off, stays off for 30 minutes.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_camera_motion_detected
    to: 'on'
    id: motion
  - trigger: time_pattern
    minutes: /5
    id: recheck
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion
      - condition: state
        entity_id:
        - light.office_light_1
        - light.office_light_2
        - light.office_light_3
        - light.office_light_4
        state: 'off'
        for: 00:00:20
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.office_lights_auto_off
          state: 'on'
        - condition: state
          entity_id:
          - light.office_light_1
          - light.office_light_2
          - light.office_light_3
          - light.office_light_4
          state: 'off'
          for: 00:30:00
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ repeat.index <= 12 and is_state(''binary_sensor.office_camera_motion_detected'',
              ''on'') }}'
          sequence:
          - delay: 00:00:02
          - action: script.office_presence_check
            data:
              source: 'motion check {{ repeat.index }} of 12'
            response_variable: first
            continue_on_error: true
          - if:
            - condition: template
              value_template: '{{ first is defined and first.person_present == true
                }}'
            then:
            - action: light.turn_on
              target:
                entity_id:
                - light.office_light_1
                - light.office_light_2
                - light.office_light_3
                - light.office_light_4
            - stop: Person found
          - delay: 00:00:02
    - conditions:
      - condition: trigger
        id: recheck
      - condition: state
        entity_id: input_boolean.office_vision_enabled
        state: 'off'
      - condition: state
        entity_id:
        - light.office_light_1
        - light.office_light_2
        - light.office_light_3
        - light.office_light_4
        state: 'on'
        match: any
      sequence:
      - action: script.office_presence_check
        data:
          source: 5-minute recheck
        response_variable: first
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ first is defined and first.person_present == false }}'
        then:
        - delay: 00:02:00
        - action: script.office_presence_check
          data:
            source: confirming empty room
          response_variable: second
          continue_on_error: true
        - if:
          - condition: template
            value_template: '{{ second is defined and second.person_present == false
              }}'
          then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.office_lights_auto_off
          - action: light.turn_off
            target:
              entity_id:
              - light.office_light_1
              - light.office_light_2
              - light.office_light_3
              - light.office_light_4
  mode: single
  max_exceeded: silent
- id: office_lights_ai_mark_on
  alias: Office Lights by AI Camera - clear auto-off flag
  description: Any time the office lights come on, forget that they were last turned off automatically.
  triggers:
  - trigger: state
    entity_id:
