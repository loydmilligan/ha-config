- id: '1770232671725'
  alias: Play Local Music
  description: Plays music from local library through Music Assistant
  triggers:
  - event_type: call_play_local_music
    trigger: event
  actions:
  - target:
      entity_id: media_player.office
    data:
      media_id: Your Music Title
      enqueue: replace
      media_type: track
    action: mass.play_media
- id: '1770232705130'
  alias: Play Specific Track
  description: Plays specific track from local library
  triggers:
  - event_type: call_play_specific_track
    trigger: event
  actions:
  - target:
      entity_id: media_player.old_chromecast_2
    data:
      media_type: track
      media_id: '{{ states(''input_text.song_name'') }}'
      artist: '{{ states(''input_text.artist_name'') }}'
    action: music_assistant.play_media
- id: '1770232773499'
  alias: Queue Multiple Tracks
  description: Adds multiple tracks to queue
  triggers:
  - trigger: event
    event_type: call_queue_tracks
  actions:
  - variables:
      tracks: '{{ states(''input_text.song_name'').split('','') }}'
  - repeat:
      for_each: '{{ tracks }}'
      sequence:
      - action: music_assistant.play_media
        target:
          entity_id: media_player.old_chromecast_2
        data:
          media_id: '{{ repeat.item | trim }}'
          enqueue: add
          media_type: track
- id: '1770232792127'
  alias: Play From Filesystem
  description: Plays music from specific filesystem location
  triggers:
  - event_type: call_play_filesystem
    trigger: event
  actions:
  - target:
      entity_id: media_player.office
    data:
      media_id: filesystem_smb://folder/YourMusicFolder
      media_type: folder
      enqueue: replace
    action: mass.play_media
