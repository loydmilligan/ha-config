- id: '1773341161259'
  alias: Sleep Schedule to bedtime boolean
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bed_schedule
    id: bed_time
    to:
    - 'on'
  - trigger: state
    entity_id:
    - binary_sensor.bed_schedule
    id: wake_up_time
    to:
