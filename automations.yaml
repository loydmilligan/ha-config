- id: office_vision_poll
  alias: Office Vision Poll
  description: While the lights are on and motion has stopped, checks the room at the configured interval. Only valid empty answers count toward turning the lights off; a failed check never does.
  trace:
    stored_traces: 20
  triggers:
  - trigger: time_pattern
    seconds: /10
    id: tick
  - trigger: state
    entity_id: binary_sensor.office_camera_motion_detected
    to: 'on'
    id: motion
  conditions:
  - condition: state
    entity_id: input_boolean.office_vision_enabled
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion
      sequence:
      - action: counter.reset
        target:
          entity_id: counter.office_vision_absent_streak
      - action: input_select.select_option
        target:
          entity_id: input_select.office_presence_state
        data:
          option: motion
    - conditions:
      - condition: trigger
        id: tick
      - condition: state
        entity_id: binary_sensor.office_camera_motion_detected
        state: 'off'
      - condition: state
        entity_id:
        - light.office_light_1
        - light.office_light_2
        - light.office_light_3
        - light.office_light_4
        state: 'on'
        match: any
      - condition: template
        value_template: "{{ as_timestamp(now()) - as_timestamp(states('input_datetime.office_vision_last_poll'), 0) >= states('input_number.office_vision_poll_seconds') | float(30) - 2 }}"
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.office_vision_last_poll
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: script.office_vision_check
        data:
          source: "{{ states('input_number.office_vision_poll_seconds') | int(30) }}-second check"
        response_variable: check
        continue_on_error: true
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ check is defined and check.person_present == true }}"
          sequence:
          - action: counter.reset
            target:
              entity_id: counter.office_vision_absent_streak
          - action: input_select.select_option
            target:
              entity_id: input_select.office_presence_state
            data:
              option: vision_present
        - conditions:
          - condition: template
            value_template: "{{ check is defined and check.person_present == false and check.reused != true }}"
          sequence:
          - action: counter.increment
            target:
              entity_id: counter.office_vision_absent_streak
          - if:
            - condition: template
              value_template: "{{ states('counter.office_vision_absent_streak') | int(0) >= states('input_number.office_vision_absences_required') | int(2) and is_state('binary_sensor.office_camera_motion_detected', 'off')  and is_state('binary_sensor.office_presence_radar', 'off') }}"
            then:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.office_lights_auto_off
            - action: light.turn_off
              target:
                entity_id:
                - light.office_light_1
                - light.office_light_2
                - light.office_light_3
                - light.office_light_4
            - action: counter.reset
              target:
                entity_id: counter.office_vision_absent_streak
            - action: input_select.select_option
              target:
                entity_id: input_select.office_presence_state
              data:
                option: vision_absent
        - conditions:
          - condition: template
            value_template: "{{ check is defined and check.person_present == false }}"
          sequence: []
        default:
        - action: input_select.select_option
          target:
            entity_id: input_select.office_presence_state
          data:
            option: unknown
  mode: queued
  max: 5
  max_exceeded: silent
- id: doorbell_ring_pocket_sign
  alias: Doorbell ring to Pocket Sign
  description: When the Nest doorbell rings, show it on the Office TV right away, taking over the TV's Chromecast.
  triggers:
  - trigger: state
    entity_id: event.doorbell_chime
    not_from: unavailable
    not_to: unavailable
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type == 'ring' }}"
  actions:
  - action: rest_command.sign_message
    data:
      display: 027YiRhj
      text: "Doorbell · {{ now().strftime('%-I:%M %p') }}"
      duration: 120
      level: interrupt
      key: doorbell
      cast: true
    response_variable: sign
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ sign is not defined or sign.status | int(0) >= 300 }}"
    then:
    - action: system_log.write
      data:
        level: warning
        logger: doorbell_ring_pocket_sign
        message: "Pocket Sign did not accept the doorbell message (HTTP {{ sign.status if sign is defined else 'none' }})"
  - action: script.doorbell_describe_visitor
    response_variable: visitor
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ visitor is defined and (visitor.description | default('')) | length > 0 }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.doorbell_ring_description
      data:
        value: "{{ now().strftime('%-I:%M %p') }}: {{ visitor.description[:200] }}"
    - action: rest_command.sign_message
      data:
        display: 027YiRhj
        text: "Doorbell: {{ visitor.description[:60] }}"
        duration: 120
        level: interrupt
        key: doorbell
      continue_on_error: true
  mode: single
  max_exceeded: silent
- id: doorbell_change_check
  alias: Doorbell change check
  description: Every 5 minutes, compares a new doorbell frame with the one from 5 minutes earlier and records what changed, for the Home Assistant update screen.
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - variables:
      current: "{{ 'b' if is_state('input_boolean.doorbell_frame_slot', 'off') else 'a' }}"
      previous: "{{ 'a' if current == 'b' else 'b' }}"
      last: "{{ states('input_datetime.doorbell_last_check') }}"
      have_previous: "{{ last not in ['unknown', 'unavailable', ''] and (as_timestamp(now()) - as_timestamp(last, 0)) < 900 }}"
  - action: shell_command.doorbell_frame
    data:
      name: "{{ current }}"
    response_variable: frame
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ frame is not defined or frame.returncode != 0 }}"
    then:
    - stop: No doorbell frame this time
  - action: input_boolean.toggle
    target:
      entity_id: input_boolean.doorbell_frame_slot
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.doorbell_last_check
    data:
      timestamp: "{{ now().timestamp() }}"
  - if:
    - condition: template
      value_template: "{{ not have_previous }}"
    then:
    - stop: First frame; nothing to compare yet
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Doorbell change check
      entity_id: ai_task.anthropic_claude_haiku_5_5
      instructions: Two snapshots from the same fixed front-door doorbell camera,
        about five minutes apart. The first image is earlier and the second is now.
        Has anything meaningfully changed, such as people, animals, packages, vehicles,
        or objects added, removed or moved? Ignore lighting, shadows, day or night and
        infrared switching, weather, image noise and compression. Describe, do not identify
        anyone. In summary, say in under 20 words what changed, or "No change".
      structure:
        changed:
          description: True only for a meaningful change
          required: true
          selector:
            boolean: {}
        summary:
          description: Under 20 words
          required: true
          selector:
            text: {}
      attachments:
      - media_content_id: "media-source://media_source/local/doorbell/{{ previous }}.jpg"
        media_content_type: image/jpeg
      - media_content_id: "media-source://media_source/local/doorbell/{{ current }}.jpg"
        media_content_type: image/jpeg
    response_variable: ai
  - if:
    - condition: template
      value_template: "{{ ai is not defined or ai.data is not defined or ai.data.changed is not defined }}"
    then:
    - stop: AI check failed
  - action: "input_boolean.turn_{{ 'on' if ai.data.changed else 'off' }}"
    target:
      entity_id: input_boolean.doorbell_change_detected
  - action: input_text.set_value
    target:
      entity_id: input_text.doorbell_change_summary
    data:
      value: "{{ (ai.data.summary | string)[:250] }}"
  - if:
    - condition: template
      value_template: "{{ ai.data.changed }}"
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.doorbell_last_change
      data:
        timestamp: "{{ now().timestamp() }}"
  mode: single
  max_exceeded: silent
- id: office_lights_radar
  alias: Office Lights by Radar
  description: Either radar sensor seeing someone turns the office lights on; 5 minutes with neither seeing anyone turns them off. Respects the 30-minute hold after a manual off. The camera and AI checks stay as a backup.
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_presence_radar
    to: 'on'
    id: present
  - trigger: state
    entity_id: binary_sensor.office_presence_radar
    to: 'off'
    for: 00:05:00
    id: empty
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: present
      - condition: state
        entity_id:
        - light.office_light_1
        - light.office_light_2
        - light.office_light_3
        - light.office_light_4
        state: 'off'
        for: 00:00:20
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.office_lights_auto_off
          state: 'on'
        - condition: state
          entity_id:
          - light.office_light_1
          - light.office_light_2
          - light.office_light_3
          - light.office_light_4
          state: 'off'
          for: 00:30:00
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.office_light_1
          - light.office_light_2
          - light.office_light_3
          - light.office_light_4
    - conditions:
      - condition: trigger
        id: empty
      - condition: state
        entity_id:
        - light.office_light_1
        - light.office_light_2
        - light.office_light_3
        - light.office_light_4
        state: 'on'
        match: any
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_lights_auto_off
      - action: light.turn_off
        target:
          entity_id:
          - light.office_light_1
          - light.office_light_2
          - light.office_light_3
          - light.office_light_4
  mode: queued
