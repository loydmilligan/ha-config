- id: '1763440155306'
  alias: Office Lights
  description: 'on : on

    off : off

    up : +8%

    down : -8%'
  triggers:
  - domain: mqtt
    device_id: 38afe12bf7761bc469e5ccb38e8c6fb0
    type: action
    subtype: on_press
    metadata: {}
    trigger: device
    id: 'on'
  - domain: mqtt
    device_id: 38afe12bf7761bc469e5ccb38e8c6fb0
    type: action
    subtype: on_hold
    trigger: device
    id: on_hold
  - domain: mqtt
    device_id: 38afe12bf7761bc469e5ccb38e8c6fb0
    type: action
    subtype: off_press
    trigger: device
    id: 'off'
  - domain: mqtt
    device_id: 38afe12bf7761bc469e5ccb38e8c6fb0
    type: action
    subtype: up_press
    trigger: device
    id: up
  - domain: mqtt
    device_id: 38afe12bf7761bc469e5ccb38e8c6fb0
    type: action
    subtype: down_press
    trigger: device
    id: down
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'on'
      sequence:
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.office_light_2
          - light.office_light_3
          - light.office_light_4
          - light.office_light_1
    - conditions:
      - condition: trigger
        id:
        - on_hold
      sequence:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id: light.kitchen_downlights
    - conditions:
      - condition: trigger
        id:
        - down
      sequence:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: -8
        target:
          entity_id:
          - light.office_light_2
          - light.office_light_1
          - light.office_light_4
          - light.office_light_3
    - conditions:
      - condition: trigger
        id:
        - up
      sequence:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: 8
        target:
          entity_id:
          - light.office_light_2
          - light.office_light_1
          - light.office_light_4
          - light.office_light_3
    - conditions:
      - condition: trigger
        id:
        - 'off'
      sequence:
      - action: light.turn_off
        metadata: {}
        data:
          transition: 4
        target:
          entity_id:
          - light.office_light_2
          - light.office_light_1
          - light.office_light_4
          - light.office_light_3
  mode: single
