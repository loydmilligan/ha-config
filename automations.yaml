    type: action
    subtype: button_2_press
    trigger: device
    id: press_2
  - domain: mqtt
    device_id: 8531efeed28e09ad07ff53f5b4f8b195
    type: action
    subtype: button_3_press
    trigger: device
    id: press_3
  - domain: mqtt
    device_id: 8531efeed28e09ad07ff53f5b4f8b195
    type: action
    subtype: button_4_press
    trigger: device
    id: press_4
  - domain: mqtt
    device_id: 544d1022ec14d15b3d84ffee8b173845
    type: action
    subtype: single
    trigger: device
    id: kitch_button_single
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - press_1
      sequence:
      - action: light.toggle
        metadata: {}
        target:
          entity_id: light.hall_light
        data: {}
    - conditions:
      - condition: trigger
        id:
        - hall_motion_detected
      sequence:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.hall_light
        data:
          transition: 2
    - conditions:
      - condition: trigger
        id:
        - hall_motion_cleared
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.hall_light
        data:
          transition: 7
    - conditions:
