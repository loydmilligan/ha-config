  - domain: mqtt
    device_id: e7bb18844ab765c105dc30a13d1033b4
    type: action
    subtype: left_press
    metadata: {}
    trigger: device
    id: Left
  - domain: mqtt
    device_id: e7bb18844ab765c105dc30a13d1033b4
    type: action
    subtype: right_press
    trigger: device
    id: right
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Left
      sequence:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.gallery_light_1
          - light.gallery_light_2
          - light.gallery_light_3
    - conditions:
      - condition: trigger
        id:
        - right
      sequence:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.fireplace_light_1
          - light.fireplace_light_2
