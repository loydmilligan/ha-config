- id: doorbell_ring_pocket_sign
  alias: Doorbell ring to Pocket Sign
  description: When the Nest doorbell rings, show it on the Office TV right away, taking over the TV's Chromecast.
  triggers:
  - trigger: state
    entity_id: event.doorbell_chime
    not_from: unavailable
    not_to: unavailable
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type == 'ring' }}"
  actions:
  - action: rest_command.sign_message
    data:
      display: 027YiRhj
      text: "Doorbell · {{ now().strftime('%-I:%M %p') }}"
      duration: 120
      level: interrupt
      key: doorbell
      cast: true
    response_variable: sign
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ sign is not defined or sign.status | int(0) >= 300 }}"
    then:
    - action: system_log.write
      data:
        level: warning
        logger: doorbell_ring_pocket_sign
        message: "Pocket Sign did not accept the doorbell message (HTTP {{ sign.status if sign is defined else 'none' }})"
  - action: script.doorbell_describe_visitor
    response_variable: visitor
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ visitor is defined and (visitor.description | default('')) | length > 0 }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.doorbell_ring_description
      data:
        value: "{{ now().strftime('%-I:%M %p') }}: {{ visitor.description[:200] }}"
    - action: rest_command.sign_message
      data:
        display: 027YiRhj
        text: "Doorbell: {{ visitor.description[:60] }}"
        duration: 120
        level: interrupt
        key: doorbell
      continue_on_error: true
  mode: single
  max_exceeded: silent
- id: doorbell_change_check
  alias: Doorbell change check
  description: Every 5 minutes, compares a new doorbell frame with the one from 5 minutes earlier and records what changed, for the Home Assistant update screen.
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - variables:
      current: "{{ 'b' if is_state('input_boolean.doorbell_frame_slot', 'off') else 'a' }}"
      previous: "{{ 'a' if current == 'b' else 'b' }}"
      last: "{{ states('input_datetime.doorbell_last_check') }}"
      have_previous: "{{ last not in ['unknown', 'unavailable', ''] and (as_timestamp(now()) - as_timestamp(last, 0)) < 900 }}"
  - action: shell_command.doorbell_frame
    data:
      name: "{{ current }}"
    response_variable: frame
    continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ frame is not defined or frame.returncode != 0 }}"
    then:
    - stop: No doorbell frame this time
  - action: input_boolean.toggle
    target:
      entity_id: input_boolean.doorbell_frame_slot
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.doorbell_last_check
    data:
      timestamp: "{{ now().timestamp() }}"
  - if:
    - condition: template
      value_template: "{{ not have_previous }}"
    then:
    - stop: First frame; nothing to compare yet
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Doorbell change check
      entity_id: ai_task.anthropic_claude_haiku_5_5
      instructions: Two snapshots from the same fixed front-door doorbell camera,
        about five minutes apart. The first image is earlier and the second is now.
        Has anything meaningfully changed, such as people, animals, packages, vehicles,
        or objects added, removed or moved? Ignore lighting, shadows, day or night and
        infrared switching, weather, image noise and compression. Describe, do not identify
        anyone. In summary, say in under 20 words what changed, or "No change".
      structure:
        changed:
          description: True only for a meaningful change
          required: true
          selector:
            boolean: {}
        summary:
          description: Under 20 words
          required: true
          selector:
            text: {}
      attachments:
      - media_content_id: "media-source://media_source/local/doorbell/{{ previous }}.jpg"
        media_content_type: image/jpeg
      - media_content_id: "media-source://media_source/local/doorbell/{{ current }}.jpg"
        media_content_type: image/jpeg
    response_variable: ai
  - if:
    - condition: template
      value_template: "{{ ai is not defined or ai.data is not defined or ai.data.changed is not defined }}"
    then:
    - stop: AI check failed
  - action: "input_boolean.turn_{{ 'on' if ai.data.changed else 'off' }}"
    target:
      entity_id: input_boolean.doorbell_change_detected
  - action: input_text.set_value
    target:
      entity_id: input_text.doorbell_change_summary
    data:
      value: "{{ (ai.data.summary | string)[:250] }}"
  - if:
    - condition: template
      value_template: "{{ ai.data.changed }}"
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.doorbell_last_change
      data:
        timestamp: "{{ now().timestamp() }}"
  mode: single
  max_exceeded: silent
- id: office_lights_radar
  alias: Office Lights by Radar
  description: Either radar sensor seeing someone turns the office lights on; 7 minutes with neither seeing anyone turns them off. Respects the 30-minute hold after a manual off. The camera and AI no longer take part (removed 2026-11-25); script.office_vision_check is on demand only.
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_presence_radar
    to: 'on'
    id: present
  - trigger: state
    entity_id: binary_sensor.office_presence_radar
    to: 'off'
    for: 00:07:00
    id: empty
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: present
      - condition: state
        entity_id:
        - light.off_lt1
        - light.off_lt2
        - light.off_lt3
        - light.off_lt4
        state: 'off'
        for: 00:00:20
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.office_lights_auto_off
          state: 'on'
        - condition: state
          entity_id:
          - light.off_lt1
          - light.off_lt2
          - light.off_lt3
          - light.off_lt4
          state: 'off'
          for: 00:30:00
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.off_lt1
          - light.off_lt2
          - light.off_lt3
          - light.off_lt4
    - conditions:
      - condition: trigger
        id: empty
      - condition: state
        entity_id:
        - light.off_lt1
        - light.off_lt2
        - light.off_lt3
        - light.off_lt4
        state: 'on'
        match: any
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_lights_auto_off
      - action: light.turn_off
        target:
          entity_id:
          - light.off_lt1
          - light.off_lt2
          - light.off_lt3
          - light.off_lt4
  mode: queued
- id: 'ham_bathroom_hue_tap'
  alias: Bathroom Hue tap
  description: >-
    ha-manager #19. 1: both lights on/off together, 2: Hue bulb, 3: SwitchBot light+fan,
    4: all off.
  triggers:
  - trigger: state
    entity_id: event.bat_sw_action
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  conditions: []
  actions:
  - variables:
      button: "{{ trigger.to_state.attributes.event_type }}"
      any_on: "{{ is_state('light.bat_lt', 'on') or is_state('switch.bathroom_fan_and_lights', 'on') }}"
  - choose:
    - conditions: "{{ button == 'press_1' and any_on }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bat_lt
      - action: switch.turn_off
        target:
          entity_id: switch.bathroom_fan_and_lights
    - conditions: "{{ button == 'press_1' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bat_lt
        data:
          brightness_pct: "{{ states('sensor.house_light_level') | int(30) }}"
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_fan_and_lights
    - conditions: "{{ button == 'press_2' and is_state('light.bat_lt', 'on') }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bat_lt
    - conditions: "{{ button == 'press_2' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bat_lt
        data:
          brightness_pct: "{{ states('sensor.house_light_level') | int(30) }}"
    - conditions: "{{ button == 'press_3' }}"
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.bathroom_fan_and_lights
    - conditions: "{{ button == 'press_4' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bat_lt
      - action: switch.turn_off
        target:
          entity_id: switch.bathroom_fan_and_lights
  mode: queued
- id: 'pocket-sign-square-button-1'
  alias: Pocket Sign square button
  description: Office TV — single starts a show when the hourly-recap screensaver is up (else next card), hold pause/resume, double dismiss overlays. Triple is free.
  triggers:
  - domain: mqtt
    device_id: f7ac7546116da2ba84174fc1a6827035
    type: action
    subtype: single
    trigger: device
    id: single
  - domain: mqtt
    device_id: f7ac7546116da2ba84174fc1a6827035
    type: action
    subtype: hold
    trigger: device
    id: hold
  - domain: mqtt
    device_id: f7ac7546116da2ba84174fc1a6827035
    type: action
    subtype: double
    trigger: device
    id: double
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - single
      sequence:
      - choose:
        # Screensaver up (:00-:50, no show running): end it and play one full rotation.
        - conditions:
          - condition: template
            value_template: >-
              {{ now().minute < 50 and
                 (state_attr('input_datetime.sign_show_until', 'timestamp') | float(0)) < now().timestamp() }}
          sequence:
          - action: rest_command.sign_ext_show
            data:
              display: 027YiRhj
              rotations: 1
            response_variable: show
            continue_on_error: true
          - if:
            - condition: template
              value_template: >-
                {{ show is defined and show.status | int(0) == 200
                   and show.content is mapping and show.content.untilMs is number }}
            then:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.sign_show_until
              data:
                timestamp: "{{ (show.content.untilMs / 1000) | int }}"
        # Rotation or a show already running: next card, as before.
        default:
        - action: rest_command.sign_ext_next
          data:
            display: 027YiRhj
          continue_on_error: true
    - conditions:
      - condition: trigger
        id:
        - hold
      sequence:
      - action: rest_command.sign_ext_pause
        data:
          display: 027YiRhj
        continue_on_error: true
    - conditions:
      - condition: trigger
        id:
        - double
      sequence:
      - action: rest_command.sign_ext_dismiss
        data:
          display: 027YiRhj
        continue_on_error: true
  mode: queued
