- id: '1773343730024'
  alias: Cast Lyrics to Chromecast when Office plays music
  description: Casts the lyrics dashboard to Old Chromecast when music starts on Office
    2
  triggers:
  - entity_id: media_player.office_2
    to: playing
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.bedtime
    state: 'off'
  actions:
  - data:
      entity_id: media_player.old_chromecast
      dashboard_path: dashboard-lyrics
      view_path: lyrics-with-audio
    action: cast.show_lovelace_view
  mode: single
- id: '1773343766460'
  alias: Stop Lyrics Cast when Office stops
  description: Turns off Chromecast when Office 2 stops playing
  triggers:
  - entity_id:
    - media_player.office_2
    from:
    - playing
    trigger: state
    to:
    - 'off'
    - paused
    - standby
    - idle
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions:
  - condition: state
    entity_id: input_boolean.bedtime
    state: 'off'
  actions:
  - target:
      entity_id: media_player.old_chromecast
    action: media_player.turn_off
    data: {}
  mode: single
